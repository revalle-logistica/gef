<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEF - Gestão de Férias e Escala</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a6b">
<meta name="description" content="Gestão de Férias e Escala 5x2 da Revalle">
<meta property="og:title" content="GEF - Gestão de Férias e Escala">
<meta property="og:description" content="Férias e escalas dos colaboradores · Revalle">
<meta property="og:image" content="https://revalle-logistica.github.io/gef/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://revalle-logistica.github.io/gef/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#eef2f9;color:#0c1a33;display:flex;align-items:center;justify-content:center;height:100vh}.l{text-align:center;color:#44526b}.s{width:34px;height:34px;border:4px solid #dbe2ee;border-top-color:#0b2a6b;border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="l" id="l"><img src="logo-180.png" width="84" height="84" alt="GEF" style="border-radius:20px;display:block;margin:0 auto 14px"><div class="s"></div>Carregando o GEF…</div>
<script>
(function(){
// Link /exec do app da Web publicado no Apps Script
const U="https://script.google.com/macros/s/AKfycbyeGlvF5tbICPZGpNLu6FOmSRj4k-5q9trZbEKekanPrRRjJ7Q0Zdmflh7yTIAb9M9H7g/exec";
const K="esc5x2_app_html";
const prep=h=>h.replace('<base target="_top">','').replace(/<head>/i,'<head><script>window.API_URL='+JSON.stringify(U)+'<\/script>');
const mostra=h=>{ document.open(); document.write(h); document.close(); };
let cache=null; try{ cache=localStorage.getItem(K); }catch(e){}
// abre na hora com a versão guardada no aparelho; a nova versão é baixada em segundo plano
if(cache){ const go=()=>mostra(prep(cache)); if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",()=>setTimeout(go,0)); else setTimeout(go,0); }
fetch(U+"?raw=1",{credentials:"omit",cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.text(); }).then(h=>{
  if(!/<html/i.test(h)) throw 0;
  if(h===cache) return;
  try{ localStorage.setItem(K,h); }catch(e){ try{ localStorage.removeItem(K); }catch(_){} }
  if(!cache){ mostra(prep(h)); return; }
  const b=document.createElement("div");
  b.textContent="🔄 Nova versão da Gestão de Férias e Escala disponível — toque aqui para atualizar";
  b.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;background:#0b2a6b;color:#fff;padding:10px 16px;border-radius:12px;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;max-width:92vw;text-align:center";
  b.onclick=()=>location.reload();
  (document.body||document.documentElement).appendChild(b);
}).catch(()=>{ if(!cache){ const l=document.getElementById("l"); if(l) l.textContent="Não foi possível carregar. Verifique a internet e atualize a página."; } });
})();
</script>
</body>
</html>
