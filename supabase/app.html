<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>GEF - Gestão de Férias e Escala</title><link rel="icon" href="https://revalle-logistica.github.io/gef/favicon-32.png"><meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="https://revalle-logistica.github.io/gef/favicon-32.png">
  <link rel="apple-touch-icon" href="https://revalle-logistica.github.io/gef/logo-180.png">
  <meta name="theme-color" content="#0b2a6b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&family=Public+Sans:wght@400;600;700&display=swap">
  <style>
:root{--bg:#eef2f9;--sf:#fff;--sunk:#f6f8fc;--ink:#0c1a33;--mut:#44526b;--fa:#7b879c;--ln:#dbe2ee;
--b9:#071a44;--b8:#0b2a6b;--ac:#1446c8;--acs:#e3eafb;--ok:#0f7b4a;--oks:#e1f3ea;--al:#9a5800;--als:#fdf0d8;--er:#b42318;--ers:#fde6e3;
--sh:0 1px 2px rgba(12,26,51,.06),0 8px 24px rgba(12,26,51,.06);--fd:"Archivo","Arial Narrow",Arial,sans-serif;--fb:"Public Sans","Segoe UI",Arial,sans-serif;--r:12px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb)}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.boot{display:grid;place-items:center;min-height:100vh;color:var(--mut)}
.btn{appearance:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn:disabled{opacity:.5;cursor:default}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#fff}.btn.dk{background:var(--b8);border-color:var(--b8);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.er{color:var(--er)}.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg,.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
input,select{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:var(--sf);width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#071a44,#0b2a6b 55%,#1446c8)}
.lg-c{width:100%;max-width:400px;background:var(--sf);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.lg-h{padding:22px 24px 14px;display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;background:var(--b8);color:#fff;display:grid;place-items:center;font:900 20px var(--fd)}
.logo{background:#0b2a6b url(https://revalle-logistica.github.io/gef/logo-180.png) center/cover no-repeat !important;color:transparent !important;font-size:0 !important;overflow:hidden}
.top .logo{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.lg-h b{font:800 20px var(--fd);display:block}.lg-h small{color:var(--mut)}
.lg-t{display:grid;grid-template-columns:1fr 1fr;margin:0 24px;background:var(--sunk);border-radius:10px;padding:4px}
.lg-t button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--mut)}
.lg-t button[aria-pressed=true]{background:var(--sf);color:var(--b8);box-shadow:var(--sh)}
.lg-f{padding:16px 24px 24px;display:grid;gap:12px}.lg-f .btn{justify-content:center;padding:11px}
.lg-n{font-size:12.5px;color:var(--mut);margin:0}
.msgbox{padding:10px 12px;border-radius:8px;font-size:13px}.msgbox.er{background:var(--ers);color:var(--er)}.msgbox.ok{background:var(--oks);color:var(--ok)}
/* casca */
.top{background:linear-gradient(90deg,#0b2a6b,#1446c8);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.top .logo{width:34px;height:34px;font-size:17px;background:#fff;color:var(--b8)}
.top .br b{font:800 17px var(--fd);display:block;line-height:1.1}.top .br small{opacity:.8;font-size:12px}
.nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.nav button{border:0;background:transparent;color:rgba(255,255,255,.85);padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.1)}.nav button[aria-current=true]{background:rgba(255,255,255,.2);color:#fff}
.nav em{font-style:normal;background:#f0b450;color:#2a1800;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:800}
.usr{display:flex;align-items:center;gap:8px;font-size:12.5px}.usr .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
main{max-width:1280px;margin:0 auto;padding:18px;display:grid;gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--ln)}
.card-h h3{font-size:16px;color:var(--b8)}.card-b{padding:14px 16px}
.hint{color:var(--mut);font-size:13px;margin:0}
/* filtros */
.filt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.chip{border:1px solid var(--ln);background:var(--sf);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--b8);border-color:var(--b8);color:#fff}
.chip i{font-style:normal;font-family:var(--fd);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.d-OK{background:var(--ok)}.d-ALERTA{background:#e8a317}.d-ERRO{background:var(--er)}.d-SEM{background:#b7c0d0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--sunk);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);position:sticky;top:58px;z-index:10}
.acts .sp{flex:1}.acts b{font-family:var(--fd)}
/* lista */
.ls{display:grid}
.ln{display:grid;grid-template-columns:28px minmax(180px,1.6fr) minmax(130px,1fr) 250px 64px 160px 74px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln)}
.ln.hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;background:var(--sunk);padding:8px 16px}
.ln:hover:not(.hd){background:#f8faff}
.ln input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac)}
.nm b{display:block}.nm small,.fn small{color:var(--mut);font-size:12px;display:block}
.tg{display:inline-block;font:800 10px var(--fd);letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:#ffd23f;color:#0b2a6b;margin-left:6px;vertical-align:1px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{border-radius:5px;text-align:center;font-size:10.5px;font-weight:700;padding:5px 0;line-height:1.1}
.wk small{display:block;font-size:9px;opacity:.75;font-weight:600}
.wk .t{background:var(--ac);color:#fff}.wk .f{background:var(--als);color:var(--al)}.wk .n{background:var(--sunk);color:var(--fa);border:1px dashed var(--ln)}.wk .n.an{background:repeating-linear-gradient(135deg,#f6f8fc 0 4px,#eceff5 4px 8px)}.wk .n small{font-size:9px;line-height:1.1;text-align:center}
.hr{font-family:var(--fd);font-weight:800;font-size:15px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-OK{background:var(--oks);color:var(--ok)}.p-ALERTA{background:var(--als);color:var(--al)}.p-ERRO{background:var(--ers);color:var(--er)}.p-SEM{background:var(--sunk);color:var(--mut)}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
@media(max-width:900px){
 .ln.hd{display:none}
 .ln{grid-template-columns:28px 1fr auto;grid-template-areas:"c n s" ". f f" ". w w" ". h e";row-gap:6px}
 .ln>:nth-child(1){grid-area:c}.ln>:nth-child(2){grid-area:n}.ln>:nth-child(3){grid-area:f}.ln>:nth-child(4){grid-area:w}
 .ln>:nth-child(5){grid-area:h;text-align:left}.ln>:nth-child(6){grid-area:s}.ln>:nth-child(7){grid-area:e;justify-self:end}
 .nav{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
 .acts{top:0;position:static}
 main{padding:12px}
}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,15,40,.5);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.mdl{background:var(--sf);border-radius:16px;width:100%;max-width:820px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mdl.sm{max-width:480px}
.mdl-h{background:var(--b8);color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:2}
.mdl-h h2{font-size:19px}.mdl-h small{opacity:.85;display:block;font-size:12.5px}.mdl-h .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}
.mdl-b{padding:16px 18px;display:grid;gap:14px}.mdl-f{padding:12px 18px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--sunk);position:sticky;bottom:0}
@media(max-width:640px){.modal{padding:0}.mdl{border-radius:0;max-height:100vh;min-height:100vh}}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.sw{display:flex;align-items:center;gap:10px;background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;font-size:13px}
.sw input{width:20px;height:20px;accent-color:var(--ac)}
/* editor */
.ed{display:grid;gap:6px}
.ed-r{display:grid;grid-template-columns:92px 110px 1fr 1fr 96px 62px;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--sunk)}
.ed-r.f{background:var(--als)}.ed-r.hd{background:transparent;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;padding:0 8px}
.ed-r b{font-family:var(--fd)}
.tgl{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--sf)}
.tgl button{border:0;background:transparent;padding:6px 0;font-size:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.tgl button.on.t{background:var(--ac);color:#fff}.tgl button.on.f{background:#e8a317;color:#2a1800}
.ed-r .hh{font-family:var(--fd);font-weight:800;text-align:right}
.ed-r.f .fz{grid-column:3/6;color:var(--al);font-weight:800;font-size:12.5px;letter-spacing:.06em}
@media(max-width:640px){.ed-r{grid-template-columns:1fr 110px;row-gap:6px}.ed-r.hd{display:none}.ed-r .hh{grid-column:2}.ed-r.f .fz{grid-column:1/3}}
.val{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.val.OK{background:var(--oks)}.val.ALERTA{background:var(--als)}.val.ERRO{background:var(--ers)}
.val-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.val-h b{font:800 16px var(--fd)}
.gauge{flex:1;min-width:160px;height:10px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden}.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.val.ERRO .gauge i{background:var(--er)}.val.ALERTA .gauge i{background:#e8a317}
.val ul{margin:0;padding-left:18px;font-size:13px;display:grid;gap:3px}.val li.erro{color:var(--er)}.val li.alerta{color:var(--al)}.val li.info{color:var(--mut)}
/* painel */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:16px 14px 12px}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--ac)}
.kpi.OK::before{background:var(--ok)}.kpi.ALERTA::before{background:#e8a317}.kpi.ERRO::before{background:var(--er)}.kpi.SEM::before{background:#b7c0d0}
.kpi span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kpi b{display:block;font:800 36px/1.05 var(--fd)}.kpi small{color:var(--mut);font-size:12px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prg{display:grid;gap:10px}
.pr{display:grid;grid-template-columns:minmax(110px,180px) 1fr 60px;gap:10px;align-items:center;font-size:13px}
.pr b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr .pc{font:800 14px var(--fd);text-align:right}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stk i{display:block;height:100%}.stk .OK{background:var(--ok)}.stk .ALERTA{background:#e8a317}.stk .ERRO{background:var(--er)}.stk .SEM{background:#cfd6e3}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:12.5px}
.hm th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:2px}
.hm td{text-align:center;border-radius:6px;padding:7px 2px;font:800 13px var(--fd)}.hm td.n{text-align:left;font:600 12.5px var(--fb);padding-right:8px}
.pend{display:grid}.pend button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--ln);font-size:13px}
.pend button:hover{background:var(--sunk)}.pend small{color:var(--mut);margin-left:auto;text-align:right;max-width:55%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
/* usuários / importar / regras */
.us{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);align-items:start}
.us b{font-size:14.5px}.us small{display:block;color:var(--mut);font-size:12.5px}
.ck{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ck label{display:flex;align-items:center;gap:5px;border:1px solid var(--ln);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer;background:var(--sf)}
.ck input{width:auto;accent-color:var(--ac)}
.ap{grid-column:1/-1;background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:10px}
.drop{border:2px dashed #b9c6dd;border-radius:12px;padding:26px;text-align:center;background:var(--sunk);cursor:pointer}
.drop b{display:block;font:800 16px var(--fd);color:var(--b8)}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:var(--b8);color:#fff;text-align:left;padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tb td{padding:6px 8px;border-bottom:1px solid var(--ln)}
.fl td{padding:7px 10px;white-space:nowrap}.fl td:nth-child(3){white-space:normal;width:100%}.fl .fy td{background:var(--acs);font:800 12px var(--fd);color:var(--b8);letter-spacing:.06em}.fl tr.ps{opacity:.5}.ovf{overflow-x:auto}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.rc{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:10px;padding:12px 14px}
.rc b{font:800 15px var(--fd);color:var(--b8);display:block}.rc p{margin:4px 0 0;font-size:13px;color:var(--mut)}.rc .v{font:900 26px var(--fd);color:var(--ink)}
.hero{background:linear-gradient(90deg,#071a44,#0b2a6b 60%,#1446c8);color:#fff;border-radius:14px;padding:20px;display:grid;gap:8px}
.hero h2{font-size:22px}.hero p{margin:0;opacity:.9;max-width:70ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13.5px;max-width:min(560px,calc(100% - 24px))}
.toast.er{background:var(--er)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vt{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.vt button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--b8)}
.vt button i{font-style:normal;font:800 12px var(--fd);background:var(--acs);border-radius:99px;padding:1px 8px}
.vt button[aria-pressed=true]{background:var(--b8);border-color:var(--b8);color:#fff}.vt button[aria-pressed=true] i{background:rgba(255,255,255,.2)}
.vt button.vz{opacity:.45}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--b8);color:#fff}
.gh b{font:800 15px var(--fd);margin-right:10px}.gh span{font-size:12.5px;opacity:.85}.gh .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.gf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 16px;background:var(--acs);border-bottom:1px solid var(--ln)}
.gf b{font-size:13px;color:var(--b8);min-width:170px}.gf b span{font-weight:600;color:var(--mut)}
.cd{display:grid;grid-template-columns:repeat(7,42px);gap:3px}
.cd span{background:var(--sf);border-radius:6px;text-align:center;font:800 13px var(--fd);padding:2px 0;line-height:1.1}.cd small{display:block;font:700 9px var(--fb);color:var(--mut)}
.se{font-style:normal;font-size:12px;font-weight:700;color:var(--al)}
.hm tr.hg td{font-weight:800}.hm tr.hg td.n{font:800 13px var(--fd);color:var(--b8);padding-top:10px}.hm td.fx{padding-left:16px}.hm td.sem{color:var(--al)}
@media(max-width:600px){.cd{grid-template-columns:repeat(7,1fr);width:100%}.gf b{min-width:0;width:100%}}
.cr{display:grid;grid-template-columns:28px minmax(220px,1fr) minmax(0,2fr);gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln)}
.cr input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac)}
.cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cf select{padding:6px 8px}
.pd{color:var(--al)!important;font-weight:700}.okc{color:var(--ok)!important;font-weight:700}
.tg2{font-weight:800;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--acs);color:var(--b8)}.tg2.adm{background:var(--sunk);color:var(--mut)}
.pts{padding:0 16px 12px;display:grid;gap:6px}.pts b{font-size:13px;color:var(--b8)}
a.btn{text-decoration:none}
input.int{text-align:center;font-variant-numeric:tabular-nums}input.int.bad{border-color:var(--er);background:var(--ers)}
.fsis{display:flex;flex-direction:column;overflow:hidden}.fsis-h{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap}.fsis-h div{display:grid;gap:2px}
.fsis iframe{border:0;width:100%;height:calc(100vh - 170px);min-height:520px;background:#fff}

/* ================= visão do mês ================= */
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nomeMes = ym => { const p = ym.split('-'); return MESES[+p[1] - 1] + ' de ' + p[0]; };
function mesColab(c) {
  const fer = feriasDe(c.matricula), fds = feriadosDe(c.revenda), aj = c.aj || ajustesDe(c.matricula);
  const dias = diasDoMes(S.mes).map(dt => diaEfetivo(c.escala, dt, fer, fds, aj));
  const semanas = [];
  for (let s = inicioSemana(dias[0].data); s <= dias[dias.length - 1].data; s = isoMaisDias(s, 7)) {
    const sem = semanaEfetiva(c.escala, s, fer, fds, aj);
    semanas.push({ ini: s, sem, val: validarSemanaReal(sem, { tele: c.tele, cfg: S.cfg, entrega: ehEntregaCampo(c) }) });
  }
  const horas = dias.reduce((t, d) => { const x = d.tipo === 'T' ? calcDia(d) : null; return t + (x ? x.liquido : 0); }, 0);
  return { dias, semanas, horas };
}
function vMes(m) {

  if (!S.cols.length) { m.innerHTML = `<div class="card empty"><h3>Nenhum colaborador por aqui ainda</h3><p>${veTudo() ? 'Importe o relatório do DP na aba <b>Importar DP</b>.' : 'Ainda não há colaboradores vinculados a você.'}</p></div>`; return; }

  [...S.mSel].forEach(x => { if (!L.some(c => c.matricula === x)) S.mSel.delete(x); });
  const ferAll = d => S.feriados.filter(x => x.data === d && (!f.rev || x.revenda === f.rev));
  let corpo = '', gi = 0, nErro = 0;

    arr.forEach(c => {

      corpo += `<tr class="${S.mSel.has(c.matricula) ? 'sel' : ''}"><td class="mn">${podeLote ? `<input type="checkbox" class="msel" data-msel="${esc(c.matricula)}" ${S.mSel.has(c.matricula) ? 'checked' : ''} aria-label="Selecionar ${esc(c.nome)}">` : ''}<button type="button" class="lk" data-ed="${esc(c.matricula)}" title="Abrir o padrão semanal">${esc(c.nome)}</button><small>${esc(codigoMatricula(c.matricula))} · ${esc(c.funcao)}</small></td>` +
        M.dias.map(d => {
          const cl = d.tipo === 'T' ? 't' : d.tipo === 'F' ? 'f' : d.tipo === 'FER' ? 'v' : 'n', h = d.feriado ? ' h' : '', a = d.ajuste ? ' aj' : '';
          const tx = d.tipo === 'T' ? esc(String(d.ent || '').slice(0, 2) + (String(d.ent || '').slice(3, 5) !== '00' ? ':' + String(d.ent || '').slice(3, 5) : 'h')) : d.tipo === 'F' ? 'F' : d.tipo === 'FER' ? 'V' : d.antes ? '' : '·';
          const tt = `${DIAS_SEMANA[diaSemanaIso(d.data)]} ${dataBr(d.data)}: ${d.tipo === 'T' ? d.ent + '–' + d.sai : d.tipo === 'F' ? 'folga' : d.tipo === 'FER' ? 'férias' : d.antes ? 'antes do início da escala (' + dataBr(d.antes) + ')' : 'sem escala'}${d.feriado ? ' · feriado: ' + d.feriado : ''}${d.ajuste ? ' · alterado' : ''}`;
          return `<td class="md"><button type="button" class="mc ${cl}${h}${a}" data-dm="${esc(c.matricula)}" data-dd="${d.data}" title="${esc(tt)}">${tx}</button></td>`;
        }).join('') +

    });
    gi++;
  });
  m.innerHTML = `<section class="card">
    <div class="sw2"><button type="button" class="btn sm" data-mm="-1" aria-label="Mês anterior">‹</button>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px">Mês<input type="month" data-mes value="${esc(S.mes)}" style="width:auto"></label>
      <button type="button" class="btn sm" data-mm="1" aria-label="Próximo mês">›</button><b style="color:var(--b8)">${esc(nomeMes(S.mes))}</b>
      ${nErro ? `<span class="pill p-ERRO">${nErro} colaborador(es) com semana fora das regras</span>` : ''}</div>
    <div class="esc-top"><span></span><label class="busca">${ic('search')}<input type="search" data-f="q" value="${esc(f.q)}" placeholder="Buscar nome, matrícula ou função" aria-label="Buscar"></label></div>
    <div class="fx" id="fbar">${barraFiltros(false)}</div>

      <button type="button" class="btn sm" data-mx>${ic('xls')}Excel do mês</button>
      <button type="button" class="btn sm" data-mp="fichas">${ic('pdf')}PDF do mês por colaborador</button>

    <div class="ovf mw"><table class="mt"><thead><tr><th class="mn">Colaborador</th>${datas.map(d => { const fs = ferAll(d); return `<th class="${diaSemanaIso(d) === 6 ? 'dom' : ''}${fs.length ? ' fer' : ''}" title="${esc(fs.map(x => x.descricao + ' (' + x.revenda + ')').join(', '))}">${+d.slice(8)}<small>${DIAS_CURTO[diaSemanaIso(d)].charAt(0)}</small></th>`; }).join('')}<th>Horas</th><th>Semanas</th></tr></thead>
      <tbody>${corpo || `<tr><td colspan="${datas.length + 3}" class="empty">Ninguém nesta visão.</td></tr>`}</tbody></table></div></section>`;
  m.querySelector('[data-mes]').onchange = e => { if (e.target.value) { S.mes = e.target.value; vMes(m); } };
  m.onchange = e => {

    if (e.target.dataset.ff && trataFiltro(e.target)) vMes(m);
  };
  m.querySelector('input[data-f=q]').oninput = e => { f.q = e.target.value; clearTimeout(S.tq); S.tq = setTimeout(() => { vMes(m); const i = m.querySelector('input[data-f=q]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); };
  m.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mm) { const p = S.mes.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1 + +b.dataset.mm, 1)); S.mes = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); vMes(m); }
    else if (trataFiltro(b)) vMes(m);

    else if (b.hasAttribute('data-mlimpa')) { S.mSel.clear(); vMes(m); }

/** Cada pessoa selecionada repete a própria semana escolhida no período todo (vira o padrão semanal dela). */

/** Troca de dias em lote: as mesmas datas para várias pessoas (folga, trabalho com horário ou volta ao padrão). */

      <div class="row2" id="lote-h"><label class="f">Entrada<input type="time" data-lk="ent" value="${esc(st.ent)}"></label><label class="f">Saída<input type="time" data-lk="sai" value="${esc(st.sai)}"></label>

      <p class="hint" id="lote-res"></p></div>
    <div class="mdl-f"><span style="flex:1"></span><button type="button" class="btn" data-x>Cancelar</button><button type="button" class="btn pr" data-lsalva>Aplicar</button></div>`, true);

let _h2p = null;

  pags = pags.flatMap(pg => {

function baixar(b64, nome, mime) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}

/** Planilha "Programação de férias" do DP: uma linha por período aquisitivo, com até 2 períodos de gozo (Início + Dias). */
async function lerFerias(file) {
  const X = await loadXLSX(), wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const nomes = wb.SheetNames.slice().sort((a, b) => (/programa..o de f.rias/i.test(nrm(b)) ? 1 : 0) - (/programa..o de f.rias/i.test(nrm(a)) ? 1 : 0));
  const paraIso = v => {
    if (typeof v === 'number') { const d = X.SSF.parse_date_code(v); return d ? d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0') : ''; }
    const s = String(v).trim(); let k = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (k) return k[0];
    k = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (k) { const y = k[3].length === 2 ? '20' + k[3] : k[3]; return y + '-' + k[2].padStart(2, '0') + '-' + k[1].padStart(2, '0'); }
    return '';
  };
  for (const n of nomes) {
    const A = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true });
    const hi = A.slice(0, 30).findIndex(r => { const H = r.map(nrm); return H.includes('codigo') && H.includes('empregado') && H.includes('inicio'); });
    if (hi < 0) continue;
    const H = A[hi].map(nrm), ci = H.indexOf('codigo'), cn = H.indexOf('empregado'), co = H.findIndex(h => /^observa/.test(h));
    // cada "Início" de gozo com o "Dias" e o "Fim" que vêm logo depois dele
    const blocos = H.map((h, i) => h === 'inicio' ? i : -1).filter(i => i >= 0).map(i => {
      const ate = H.findIndex((h, j) => j > i && h === 'inicio'), lim = ate < 0 ? H.length : ate, acha = k => { const j = H.findIndex((h, x) => x > i && x < lim && h === k); return j; };
      return { ini: i, dias: acha('dias'), fim: acha('fim') };
    });
    const titulo = A.slice(0, hi).flat().map(String).join(' '), cod = (titulo.match(/\(([A-Z]{2})\)/) || [])[1];
    const itens = [];
    A.slice(hi + 1).forEach(r => {
      const codigo = String(r[ci] == null ? '' : r[ci]).trim(), nome = String(r[cn] || '').trim();
      if (!codigo && !nome) return;
      blocos.forEach(b => {
        const ini = paraIso(r[b.ini]); if (!ini) return;
        const dias = b.dias >= 0 ? parseInt(r[b.dias], 10) : 0;
        const fim = dias > 0 ? isoMaisDias(ini, dias - 1) : (b.fim >= 0 ? paraIso(r[b.fim]) : '');
        if (fim) itens.push({ codigo, nome, inicio: ini, fim, dias: dias || (Math.round((Date.parse(fim) - Date.parse(ini)) / 864e5) + 1), obs: co >= 0 ? String(r[co] || '').trim() : '' });
      });
    });
    return { itens, revenda: (cod && COD_REV[cod]) || '', arquivo: file.name };
  }
  throw new Error('Não achei a aba de programação (colunas Código, Empregado e Início).');
}

function vPropostas(m) {
  const L = (S.propostas || []).slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));

  m.innerHTML = `<section class="card"><div class="card-h"><h3>${an ? 'Minhas propostas aguardando o supervisor' : 'Propostas aguardando sua aprovação'} (${pend.length})</h3>

    if (b.hasAttribute('data-pc')) return ocupado(b, async () => { troca(await call('cancelarProposta', { id })); toast('Proposta cancelada.'); render(); });

/* ================= minha escala (link do colaborador, só leitura) ================= */
async function telaMinha(tk) {
  root.innerHTML = '<div class="mn"><div class="mn-c" style="text-align:center;padding:40px 16px"><span class="spin"></span><p class="hint">Carregando sua escala…</p></div></div>';
  let D;
  try { D = await call('minhaEscala', { token: tk }); }
  catch (e) { root.innerHTML = `<div class="mn"><div class="mn-c" style="text-align:center;padding:40px 18px"><span class="logo">R</span><h2 style="margin:14px 0 6px">Escala indisponível</h2><p class="hint">${esc(e.message)}</p></div></div>`; return; }
  const hj = hoje(); let ym = hj.slice(0, 7);
  const aj = {}; D.ajustes.forEach(a => { aj[a.data] = a; });
  const fh = m => { const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? String(r).padStart(2, '0') : ''); };
  const linha = (data, dd) => {
    const ds = DIAS_SEMANA[diaSemanaIso(data)], cls = dd.tipo === 'T' ? 't' : dd.tipo === 'FER' ? 'v' : dd.tipo === 'F' ? 'f' : 'n';
    const txt = dd.tipo === 'T' ? `<b>${esc(dd.ent)} às ${esc(dd.sai)}</b><small>Trabalho${dd.int ? ' · intervalo de ' + fh(dd.int) : ''}</small>` : dd.tipo === 'FER' ? '<b>Férias</b>' : dd.tipo === 'F' ? `<b>Folga</b>${diaSemanaIso(data) === 6 ? '<small>Descanso semanal</small>' : ''}` : dd.antes ? `<b>—</b><small>Antes do início da escala (${dataBr(dd.antes)})</small>` : '<b>—</b><small>Escala ainda não definida</small>';
    return `<div class="mn-d ${cls}${data === hj ? ' hj' : ''}"><div class="mn-dt"><b>${data.slice(8)}</b><small>${ds.slice(0, 3)}</small></div><div class="mn-tx">${txt}${dd.feriado ? `<span class="tg">🎉 ${esc(dd.feriado)}</span>` : ''}${dd.ajuste ? '<span class="tg">alterado</span>' : ''}</div>${data === hj ? '<em>hoje</em>' : ''}</div>`;
  };
  // dias seguidos de férias viram um bloco só, com o retorno
  const linhas = L => {
    let h = '';
    for (let i = 0; i < L.length; i++) {
      if (L[i][1].tipo !== 'FER') { h += linha(L[i][0], L[i][1]); continue; }
      let j = i; while (j + 1 < L.length && L[j + 1][1].tipo === 'FER') j++;
      const ini = L[i][0], fimMes = L[j][0];
      let fim = fimMes, r = isoMaisDias(fimMes, 1), k = 0;
      while (k++ < 60 && diaEfetivo(D.escala, r, D.ferias, D.feriados, aj).tipo === 'FER') { fim = r; r = isoMaisDias(r, 1); }
      let inicioReal = ini, b = isoMaisDias(ini, -1); k = 0;
      while (k++ < 60 && diaEfetivo(D.escala, b, D.ferias, D.feriados, aj).tipo === 'FER') { inicioReal = b; b = isoMaisDias(b, -1); }
      let rd = r, rv = diaEfetivo(D.escala, rd, D.ferias, D.feriados, aj); k = 0;
      while (k++ < 14 && rv.tipo === 'F') { rd = isoMaisDias(rd, 1); rv = diaEfetivo(D.escala, rd, D.ferias, D.feriados, aj); }
      const tot = Math.round((Date.parse(fim) - Date.parse(inicioReal)) / 864e5) + 1, ehHoje = hj >= ini && hj <= fimMes;
      const dd = s => DIAS_SEMANA[diaSemanaIso(s)].slice(0, 3).toLowerCase() + ' ' + dataBr(s).slice(0, 5);
      h += `<div class="mn-d v mn-fer${ehHoje ? ' hj' : ''}"><div class="mn-dt"><b>🏖</b></div><div class="mn-tx"><b>Férias · ${dataBr(inicioReal).slice(0, 5)} a ${dataBr(fim).slice(0, 5)}</b><small>${tot} ${tot === 1 ? 'dia' : 'dias'}${inicioReal < ini || fim > fimMes ? ` (${j - i + 1} neste mês)` : ''}</small>${rv.tipo === 'T' ? `<small>Volta ao trabalho: <b>${dd(rd)} às ${esc(rv.ent)}</b></small>` : `<small>Retorno: ${dd(r)}</small>`}</div>${ehHoje ? '<em>hoje</em>' : ''}</div>`;
      i = j;
    }
    return h;
  };
  const desenha = () => {
    const dias = diasDoMes(ym), DD = dias.map(d => [d, diaEfetivo(D.escala, d, D.ferias, D.feriados, aj)]);
    const n = k => DD.filter(x => x[1].tipo === k).length, hoj = diaEfetivo(D.escala, hj, D.ferias, D.feriados, aj);
    const pv = ym > hj.slice(0, 7) ? isoMaisDias(ym + '-01', -1).slice(0, 7) : '', nx = isoMaisDias(dias[dias.length - 1], 1).slice(0, 7), podeNx = nx <= isoMaisDias(hj, 120).slice(0, 7);
    root.innerHTML = `<div class="mn"><header class="mn-h"><span class="logo">R</span><div><small>Minha escala · ${esc(D.empresa || 'Revalle')}</small><b>${esc(D.nome)}</b><small>${esc(D.funcao)} · ${esc(D.revenda)}</small></div></header>

    const cls = !x.nec && !x.n ? 'z' : x.d < 0 ? 'r' : x.d > 0 ? 'b' : 'g';
    const tip = `${DIAS_CURTO[diaDoOffset(i)]} ${f.de}–${f.ate}: precisa ${x.nec}, tem ${x.n}${x.exc ? ' (exceção' + (x.exc.obs ? ': ' + x.exc.obs : '') + ')' : ''}` +
      (x.todo.length ? `\nFaixa toda: ${x.todo.map(qlpNm).join(', ')}` : '') + (x.maior.length ? `\nMaior parte (conta): ${x.maior.map(qlpNm).join(', ')}` : '') + (x.menor.length ? `\nMetade ou menos (não conta): ${x.menor.map(qlpNm).join(', ')}` : '');
    return `<td class="q${cls}" title="${esc(tip)}"><b>${x.n}</b><span>/${x.nec}</span>${x.d ? `<em>${x.d > 0 ? '+' : ''}${x.d}</em>` : ''}${x.menor.length ? `<small class="qp">+${x.menor.length} metade ou menos</small>` : ''}${x.exc ? '<i class="qx" aria-label="exceção"></i>' : ''}</td>`;
  }).join('')}</tr>`).join('');
  const ini5 = inicioEscala(S.cfg), antes = i => ini5 && isoMaisDias(S.semana, i) < ini5;
  const cnt = t => [0, 1, 2, 3, 4, 5, 6].map(i => antes(i) ? 0 : k.P.filter(c => c.sem[i] && c.sem[i].tipo === t).length);
  const trab = cnt('T'), ns = cnt('N'), fer = cnt('FER');
  const rodape = `<tr class="qt"><th>Trabalham no dia</th>${trab.map(n => `<td>${n}</td>`).join('')}</tr>` +
    (fer.some(Boolean) ? `<tr class="qt"><th>De férias</th>${fer.map(n => `<td>${n || ''}</td>`).join('')}</tr>` : '') +
    (ns.some(Boolean) ? `<tr class="qt qn"><th>Sem escala</th>${ns.map(n => `<td>${n || ''}</td>`).join('')}</tr>` : '');
  const st = k.falta ? `<span class="pill p-ERRO">${k.falta} faltando</span>` : k.tot ? '<span class="pill p-OK">Coberto</span>' : '';
  return `<div class="qc"><div class="qc-h"><div><b>${esc(qlpFnTxt(r.funcao))}</b><span>${QLP_GL[r.area] ? esc(qlpGrpTxt(r.area, r.grupo)) + ' · ' : ''}${k.P.length} ${k.P.length === 1 ? 'pessoa' : 'pessoas'}${(r.excecoes || []).length ? ` · ${r.excecoes.length} exceç${r.excecoes.length === 1 ? 'ão' : 'ões'}` : ''}</span></div>
    ${st}<span class="sp"></span><button type="button" class="btn sm" data-qe="${esc(r.id)}">Editar</button><button type="button" class="btn sm" data-qc="${esc(r.id)}" title="Criar outra necessidade com as mesmas faixas">Duplicar</button><button type="button" class="xp" data-qr="${esc(r.id)}" aria-label="Remover">×</button></div>
    <div class="qtw"><table class="qtb"><thead><tr><th></th>${dias}</tr></thead><tbody>${linhas}${rodape}</tbody></table></div></div>`;
}

/* ---------- editor ---------- */
function qlpEditor(r, base) {
  const ed = JSON.parse(JSON.stringify(r || Object.assign({ id: '', revenda: '', area: 'entrega', grupo: '*', funcao: '', faixas: [{ de: '06:00', ate: '08:00', q: [0, 0, 0, 0, 0, 0, 0] }], excecoes: [], obs: '' }, base || {})));
  if (!ed.faixas || !ed.faixas.length) ed.faixas = [{ de: '06:00', ate: '08:00', q: [0, 0, 0, 0, 0, 0, 0] }];
  ed.excecoes = ed.excecoes || [];
  const revs = uniq(S.cols.map(c => c.revenda));
  if (!ed.revenda) ed.revenda = revs[0] || '';
  abrirModal(`<div class="mdl-h"><div><h2>${r ? 'Editar' : 'Nova'} necessidade de QLP</h2><small>Quantas pessoas precisam estar trabalhando em cada faixa de horário</small></div><button type="button" class="x" data-x aria-label="Fechar">×</button></div>
    <div class="mdl-b" id="qed"></div>
    <div class="mdl-f"><button type="button" class="btn" data-x>Cancelar</button><button type="button" class="btn dk" data-qsalva>Salvar</button></div>`);
  const w = modal.querySelector('#qed');
  const le = () => {
    w.querySelectorAll('[data-k]').forEach(i => { ed[i.dataset.k] = i.value; });
    w.querySelectorAll('[data-fx]').forEach(tr => {
      const f = ed.faixas[+tr.dataset.fx]; if (!f) return;
      f.de = tr.querySelector('[data-de]').value; f.ate = tr.querySelector('[data-ate]').value;
      f.q = [...tr.querySelectorAll('[data-qd]')].map(i => +i.value || 0);
    });
    w.querySelectorAll('[data-ex]').forEach(tr => {
      const x = ed.excecoes[+tr.dataset.ex]; if (!x) return;
      x.data = tr.querySelector('[data-exd]').value; x.obs = tr.querySelector('[data-exo]').value;
      x.q = [...tr.querySelectorAll('[data-exq]')].map(i => +i.value || 0);
    });
  };
  const desenha = () => {
    const pool = S.cols.filter(c => c.revenda === ed.revenda && c.vis.area === ed.area), gl = QLP_GL[ed.area];
    if (!gl) ed.grupo = '*';
    const grs = qlpGrupos(ed.revenda, ed.area, ed.grupo !== '*' ? [ed.grupo] : []);
    const fns = uniq(pool.map(c => c.vis.funcao).concat(ed.funcao && ed.funcao !== '*' ? [ed.funcao] : []));
    const n = pool.filter(c => (ed.grupo === '*' || c.vis.grupo === ed.grupo) && (!ed.funcao || ed.funcao === '*' || c.vis.funcao === ed.funcao)).length;
    const num = (v, a) => `<input type="number" min="0" max="999" inputmode="numeric" value="${+v || 0}" ${a}>`;
    w.innerHTML = `<div class="qe-g">
      <label class="f">Revenda<select data-k="revenda" data-re>${revs.map(v => `<option ${v === ed.revenda ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
      <label class="f">Departamento<select data-k="area" data-re>${visoes().map(([k]) => `<option value="${k}" ${k === ed.area ? 'selected' : ''}>${VIS_CURTO[k]}</option>`).join('')}</select></label>
      ${gl ? `<label class="f">${gl}<select data-k="grupo" data-re><option value="*" ${ed.grupo === '*' ? 'selected' : ''}>${QLP_TODOS[ed.area]}</option>${grs.map(v => `<option ${v === ed.grupo ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>` : ''}
      <label class="f">Função<select data-k="funcao" data-re><option value="">Escolha…</option><option value="*" ${ed.funcao === '*' ? 'selected' : ''}>Todas as funções</option>${fns.map(v => `<option ${v === ed.funcao ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label></div>
      <p class="hint" style="margin:6px 0 14px">${ed.funcao ? `${n} ${n === 1 ? 'pessoa' : 'pessoas'} nessa combinação.` : 'Escolha a função.'}</p>
      <div class="qe-t"><b>Faixas de horário × dia da semana</b><span class="sp"></span><button type="button" class="btn sm" data-qcp title="Copia os números de segunda para terça a sexta">Repetir segunda até sexta</button></div>
      <div class="qtw"><table class="qtb qe"><thead><tr><th>De</th><th>Até</th>${DIAS_CURTO.map(d => `<th>${d}</th>`).join('')}<th></th></tr></thead><tbody>
      ${ed.faixas.map((f, i) => `<tr data-fx="${i}"><td><input type="time" step="300" data-de value="${esc(f.de)}"></td><td><input type="time" step="300" data-ate value="${esc(f.ate)}"></td>${[0, 1, 2, 3, 4, 5, 6].map(d => `<td>${num(f.q[d], 'data-qd')}</td>`).join('')}<td><button type="button" class="xp" data-fdel="${i}" aria-label="Remover faixa" ${ed.faixas.length < 2 ? 'disabled' : ''}>×</button></td></tr>`).join('')}
      </tbody></table></div>
      <button type="button" class="btn sm" data-fadd style="margin-top:8px">+ Faixa de horário</button>
      <div class="qe-t" style="margin-top:20px"><b>Exceções por data</b><span class="hint">feriado, inventário, data sazonal…</span><span class="sp"></span>${feriadosDe(ed.revenda).some(f => f.data >= hoje()) ? '<button type="button" class="btn sm" data-qfer>+ Próximos feriados</button>' : ''}<button type="button" class="btn sm" data-exadd>+ Exceção</button></div>
      ${ed.excecoes.length ? `<div class="qtw"><table class="qtb qe"><thead><tr><th>Data</th><th>Motivo</th>${ed.faixas.map(f => `<th>${esc(f.de)}–${esc(f.ate)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${ed.excecoes.map((x, i) => `<tr data-ex="${i}"><td><input type="date" data-exd value="${esc(x.data)}"></td><td><input data-exo value="${esc(x.obs || '')}" placeholder="Ex.: Natal" style="min-width:110px"></td>${ed.faixas.map((f, fi) => `<td>${num((x.q || [])[fi], 'data-exq')}</td>`).join('')}<td><button type="button" class="xp" data-exdel="${i}" aria-label="Remover exceção">×</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="hint">Sem exceções: vale o padrão da semana em todas as datas.</p>'}`;
  };
  desenha();
  w.addEventListener('change', e => { if (e.target.matches('[data-re]')) { le(); if (e.target.dataset.k !== 'funcao') { if (e.target.dataset.k !== 'grupo') ed.grupo = '*'; ed.funcao = ''; } desenha(); } });
  w.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; le();
    if (b.hasAttribute('data-fadd')) { const u = ed.faixas[ed.faixas.length - 1]; ed.faixas.push({ de: u ? u.ate : '06:00', ate: '', q: u ? u.q.slice() : [0, 0, 0, 0, 0, 0, 0] }); ed.excecoes.forEach(x => (x.q = x.q || []).push(0)); }
    else if (b.dataset.fdel) { const i = +b.dataset.fdel; ed.faixas.splice(i, 1); ed.excecoes.forEach(x => (x.q || []).splice(i, 1)); }
    else if (b.hasAttribute('data-qcp')) ed.faixas.forEach(f => { for (let d = 1; d < 5; d++) f.q[d] = f.q[0]; });
    else if (b.hasAttribute('data-exadd')) ed.excecoes.push({ data: '', obs: '', q: ed.faixas.map(() => 0) });
    else if (b.dataset.exdel) ed.excecoes.splice(+b.dataset.exdel, 1);
    else if (b.hasAttribute('data-qfer')) feriadosDe(ed.revenda).filter(f => f.data >= hoje() && !ed.excecoes.some(x => x.data === f.data)).slice(0, 12)
      .forEach(f => ed.excecoes.push({ data: f.data, obs: String(f.descricao || 'Feriado').slice(0, 80), q: ed.faixas.map(() => 0) }));
    else return;
    desenha();
  });
  modal.querySelector('[data-qsalva]').onclick = e => {
    le();
    if (!ed.funcao) { toast('Escolha a função (ou “Todas as funções”).', true); return; }
    if (ed.faixas.some(f => !f.de || !f.ate)) { toast('Preencha o início e o fim de cada faixa de horário.', true); return; }
    if (ed.excecoes.some(x => !x.data)) { toast('Informe a data de cada exceção (ou remova a linha).', true); return; }
    ocupado(e.currentTarget, async () => {
      const salvo = await call('salvarQlp', ed);
      S.qlp = S.qlp.filter(x => x.id !== salvo.id).concat([salvo]);
      const Q = S.q || (S.q = {}); Q.rev = salvo.revenda; Q.vis = salvo.area;
      fecharModal(true); toast('Necessidade salva.');
      if (S.view === 'qlp') vQlp($('#main'));
    });
  };
}

})();
</script>
