<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&family=Public+Sans:wght@400;600;700&display=swap">
  <style>
:root{--bg:#eef2f9;--sf:#fff;--sunk:#f6f8fc;--ink:#0c1a33;--mut:#44526b;--fa:#7b879c;--ln:#dbe2ee;
--b9:#071a44;--b8:#0b2a6b;--ac:#1446c8;--acs:#e3eafb;--ok:#0f7b4a;--oks:#e1f3ea;--al:#9a5800;--als:#fdf0d8;--er:#b42318;--ers:#fde6e3;
--sh:0 1px 2px rgba(12,26,51,.06),0 8px 24px rgba(12,26,51,.06);--fd:"Archivo","Arial Narrow",Arial,sans-serif;--fb:"Public Sans","Segoe UI",Arial,sans-serif;--r:12px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb)}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.boot{display:grid;place-items:center;min-height:100vh;color:var(--mut)}
.btn{appearance:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn:disabled{opacity:.5;cursor:default}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#fff}.btn.dk{background:var(--b8);border-color:var(--b8);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.er{color:var(--er)}.btn.sm{padding:5px 10px;font-size:12.5px}
.btn svg,.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
input,select{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:var(--sf);width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#071a44,#0b2a6b 55%,#1446c8)}
.lg-c{width:100%;max-width:400px;background:var(--sf);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.lg-h{padding:22px 24px 14px;display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;background:var(--b8);color:#fff;display:grid;place-items:center;font:900 20px var(--fd)}
.lg-h b{font:800 20px var(--fd);display:block}.lg-h small{color:var(--mut)}
.lg-t{display:grid;grid-template-columns:1fr 1fr;margin:0 24px;background:var(--sunk);border-radius:10px;padding:4px}
.lg-t button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--mut)}
.lg-t button[aria-pressed=true]{background:var(--sf);color:var(--b8);box-shadow:var(--sh)}
.lg-f{padding:16px 24px 24px;display:grid;gap:12px}.lg-f .btn{justify-content:center;padding:11px}
.lg-n{font-size:12.5px;color:var(--mut);margin:0}
.msgbox{padding:10px 12px;border-radius:8px;font-size:13px}.msgbox.er{background:var(--ers);color:var(--er)}.msgbox.ok{background:var(--oks);color:var(--ok)}
/* casca */
.top{background:linear-gradient(90deg,#0b2a6b,#1446c8);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.top .logo{width:34px;height:34px;font-size:17px;background:#fff;color:var(--b8)}
.top .br b{font:800 17px var(--fd);display:block;line-height:1.1}.top .br small{opacity:.8;font-size:12px}
.nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.nav button{border:0;background:transparent;color:rgba(255,255,255,.85);padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.1)}.nav button[aria-current=true]{background:rgba(255,255,255,.2);color:#fff}
.nav em{font-style:normal;background:#f0b450;color:#2a1800;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:800}
.usr{display:flex;align-items:center;gap:8px;font-size:12.5px}.usr .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
main{max-width:1280px;margin:0 auto;padding:18px;display:grid;gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--ln)}
.card-h h3{font-size:16px;color:var(--b8)}.card-b{padding:14px 16px}
.hint{color:var(--mut);font-size:13px;margin:0}
/* filtros */
.filt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.chip{border:1px solid var(--ln);background:var(--sf);padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--b8);border-color:var(--b8);color:#fff}
.chip i{font-style:normal;font-family:var(--fd);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.d-OK{background:var(--ok)}.d-ALERTA{background:#e8a317}.d-ERRO{background:var(--er)}.d-SEM{background:#b7c0d0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--sunk);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);position:sticky;top:58px;z-index:10}
.acts .sp{flex:1}.acts b{font-family:var(--fd)}
/* lista */
.ls{display:grid}
.ln{display:grid;grid-template-columns:28px minmax(180px,1.6fr) minmax(130px,1fr) 250px 64px 160px 74px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln)}
.ln.hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;background:var(--sunk);padding:8px 16px}
.ln:hover:not(.hd){background:#f8faff}
.ln input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac)}
.nm b{display:block}.nm small,.fn small{color:var(--mut);font-size:12px;display:block}
.tg{display:inline-block;font:800 10px var(--fd);letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:#ffd23f;color:#0b2a6b;margin-left:6px;vertical-align:1px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{border-radius:5px;text-align:center;font-size:10.5px;font-weight:700;padding:5px 0;line-height:1.1}
.wk small{display:block;font-size:9px;opacity:.75;font-weight:600}
.wk .t{background:var(--ac);color:#fff}.wk .f{background:var(--als);color:var(--al)}.wk .n{background:var(--sunk);color:var(--fa);border:1px dashed var(--ln)}
.hr{font-family:var(--fd);font-weight:800;font-size:15px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-OK{background:var(--oks);color:var(--ok)}.p-ALERTA{background:var(--als);color:var(--al)}.p-ERRO{background:var(--ers);color:var(--er)}.p-SEM{background:var(--sunk);color:var(--mut)}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
@media(max-width:900px){
 .ln.hd{display:none}
 .ln{grid-template-columns:28px 1fr auto;grid-template-areas:"c n s" ". f f" ". w w" ". h e";row-gap:6px}
 .ln>:nth-child(1){grid-area:c}.ln>:nth-child(2){grid-area:n}.ln>:nth-child(3){grid-area:f}.ln>:nth-child(4){grid-area:w}
 .ln>:nth-child(5){grid-area:h;text-align:left}.ln>:nth-child(6){grid-area:s}.ln>:nth-child(7){grid-area:e;justify-self:end}
 .nav{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
 .acts{top:0;position:static}
 main{padding:12px}
}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,15,40,.5);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.mdl{background:var(--sf);border-radius:16px;width:100%;max-width:820px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mdl.sm{max-width:480px}
.mdl-h{background:var(--b8);color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:2}
.mdl-h h2{font-size:19px}.mdl-h small{opacity:.85;display:block;font-size:12.5px}.mdl-h .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}
.mdl-b{padding:16px 18px;display:grid;gap:14px}.mdl-f{padding:12px 18px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--sunk);position:sticky;bottom:0}
@media(max-width:640px){.modal{padding:0}.mdl{border-radius:0;max-height:100vh;min-height:100vh}}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.sw{display:flex;align-items:center;gap:10px;background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;font-size:13px}
.sw input{width:20px;height:20px;accent-color:var(--ac)}
/* editor */
.ed{display:grid;gap:6px}
.ed-r{display:grid;grid-template-columns:92px 110px 1fr 1fr 96px 62px;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--sunk)}
.ed-r.f{background:var(--als)}.ed-r.hd{background:transparent;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;padding:0 8px}
.ed-r b{font-family:var(--fd)}
.tgl{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--sf)}
.tgl button{border:0;background:transparent;padding:6px 0;font-size:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.tgl button.on.t{background:var(--ac);color:#fff}.tgl button.on.f{background:#e8a317;color:#2a1800}
.ed-r .hh{font-family:var(--fd);font-weight:800;text-align:right}
.ed-r.f .fz{grid-column:3/6;color:var(--al);font-weight:800;font-size:12.5px;letter-spacing:.06em}
@media(max-width:640px){.ed-r{grid-template-columns:1fr 110px;row-gap:6px}.ed-r.hd{display:none}.ed-r .hh{grid-column:2}.ed-r.f .fz{grid-column:1/3}}
.val{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.val.OK{background:var(--oks)}.val.ALERTA{background:var(--als)}.val.ERRO{background:var(--ers)}
.val-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.val-h b{font:800 16px var(--fd)}
.gauge{flex:1;min-width:160px;height:10px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden}.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.val.ERRO .gauge i{background:var(--er)}.val.ALERTA .gauge i{background:#e8a317}
.val ul{margin:0;padding-left:18px;font-size:13px;display:grid;gap:3px}.val li.erro{color:var(--er)}.val li.alerta{color:var(--al)}.val li.info{color:var(--mut)}
/* painel */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:16px 14px 12px}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--ac)}
.kpi.OK::before{background:var(--ok)}.kpi.ALERTA::before{background:#e8a317}.kpi.ERRO::before{background:var(--er)}.kpi.SEM::before{background:#b7c0d0}
.kpi span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kpi b{display:block;font:800 36px/1.05 var(--fd)}.kpi small{color:var(--mut);font-size:12px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prg{display:grid;gap:10px}
.pr{display:grid;grid-template-columns:minmax(110px,180px) 1fr 60px;gap:10px;align-items:center;font-size:13px}
.pr b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr .pc{font:800 14px var(--fd);text-align:right}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stk i{display:block;height:100%}.stk .OK{background:var(--ok)}.stk .ALERTA{background:#e8a317}.stk .ERRO{background:var(--er)}.stk .SEM{background:#cfd6e3}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:12.5px}
.hm th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:2px}
.hm td{text-align:center;border-radius:6px;padding:7px 2px;font:800 13px var(--fd)}.hm td.n{text-align:left;font:600 12.5px var(--fb);padding-right:8px}
.pend{display:grid}.pend button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--ln);font-size:13px}
.pend button:hover{background:var(--sunk)}.pend small{color:var(--mut);margin-left:auto;text-align:right;max-width:55%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
/* usuários / importar / regras */
.us{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);align-items:start}
.us b{font-size:14.5px}.us small{display:block;color:var(--mut);font-size:12.5px}
.ck{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ck label{display:flex;align-items:center;gap:5px;border:1px solid var(--ln);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer;background:var(--sf)}
.ck input{width:auto;accent-color:var(--ac)}
.ap{grid-column:1/-1;background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:10px}
.drop{border:2px dashed #b9c6dd;border-radius:12px;padding:26px;text-align:center;background:var(--sunk);cursor:pointer}
.drop b{display:block;font:800 16px var(--fd);color:var(--b8)}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{background:var(--b8);color:#fff;text-align:left;padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tb td{padding:6px 8px;border-bottom:1px solid var(--ln)}.ovf{overflow-x:auto}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.rc{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:10px;padding:12px 14px}
.rc b{font:800 15px var(--fd);color:var(--b8);display:block}.rc p{margin:4px 0 0;font-size:13px;color:var(--mut)}.rc .v{font:900 26px var(--fd);color:var(--ink)}
.hero{background:linear-gradient(90deg,#071a44,#0b2a6b 60%,#1446c8);color:#fff;border-radius:14px;padding:20px;display:grid;gap:8px}
.hero h2{font-size:22px}.hero p{margin:0;opacity:.9;max-width:70ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13.5px;max-width:min(560px,calc(100% - 24px))}
.toast.er{background:var(--er)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vt{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.vt button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--b8)}
.vt button i{font-style:normal;font:800 12px var(--fd);background:var(--acs);border-radius:99px;padding:1px 8px}
.vt button[aria-pressed=true]{background:var(--b8);border-color:var(--b8);color:#fff}.vt button[aria-pressed=true] i{background:rgba(255,255,255,.2)}
.vt button.vz{opacity:.45}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--b8);color:#fff}
.gh b{font:800 15px var(--fd);margin-right:10px}.gh span{font-size:12.5px;opacity:.85}.gh .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.gf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 16px;background:var(--acs);border-bottom:1px solid var(--ln)}
.gf b{font-size:13px;color:var(--b8);min-width:170px}.gf b span{font-weight:600;color:var(--mut)}
.cd{display:grid;grid-template-columns:repeat(7,42px);gap:3px}
.cd span{background:var(--sf);border-radius:6px;text-align:center;font:800 13px var(--fd);padding:2px 0;line-height:1.1}.cd small{display:block;font:700 9px var(--fb);color:var(--mut)}
.se{font-style:normal;font-size:12px;font-weight:700;color:var(--al)}
.hm tr.hg td{font-weight:800}.hm tr.hg td.n{font:800 13px var(--fd);color:var(--b8);padding-top:10px}.hm td.fx{padding-left:16px}.hm td.sem{color:var(--al)}
@media(max-width:600px){.cd{grid-template-columns:repeat(7,1fr);width:100%}.gf b{min-width:0;width:100%}}
</style>

<body>
  <div id="root"><div class="boot">Carregando…</div></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script><?!= regrasFonte() ?></script>
  <script>
(function () {
'use strict';
/* ================= estado e utilidades ================= */
const S = { token: null, user: null, cfg: {}, cols: [], view: 'escalas', pend: 0, allRevs: [], allSets: [],
  f: { rev: '', st: '', q: '', tele: '', vis: '' }, sel: new Set(), pnl: { rev: '', vis: '' },
  imp: null, users: null, ed: null, lote: null, editUser: null };
const $ = s => document.querySelector(s);
const root = document.getElementById('root'), modal = document.getElementById('modal');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nrm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim().replace(/:$/, '');
const uniq = a => [...new Set(a.filter(Boolean))].sort((x, y) => x.localeCompare(y, 'pt'));
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
const dataBr = iso => iso ? String(iso).split('-').reverse().join('/') : '';
const dh = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/); return m ? `${m[3]}/${m[2]}/${m[1]}${m[4] ? ' ' + m[4] : ''}` : String(s || ''); };
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const SN = v => String(v || '').toUpperCase() === 'S';
const ROT = { OK: 'Dentro das regras', ALERTA: 'Com alerta', ERRO: 'Com erro', SEM: 'Sem escala' };
const st = c => c.val ? c.val.status : 'SEM';
const IC = {
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  up: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 17v4h16v-4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M17 11a3 3 0 1 0 0-6M21.5 20c-.6-2.2-1.8-3.8-3.5-4.7"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',

let XP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (XP) return XP;
  XP = new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; // barras escapadas: o Apps Script corta '//' ao servir
    s.onload = () => ok(window.XLSX);
    s.onerror = () => { XP = null; ko(new Error('Não consegui carregar o leitor de Excel. Verifique a internet e tente de novo.')); };
    document.head.appendChild(s);
  });
  return XP;
}
function baixar(b64, nome, mime) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}
async function pdfServidor(mats, modo) {
  if (!mats.length) throw new Error('Nenhum colaborador na lista.');
  const r = await call('exportPdf', { matriculas: mats, modo });
  baixar(r.base64, r.nome, 'application/pdf');
  toast(`PDF gerado: <b>${esc(r.nome)}</b>`);
}
function linhasDia(e) {

}

async function excelLote(list) {
  if (!list.length) throw new Error('Nenhum colaborador na lista.');
  const X = await loadXLSX();
  list = ordenar(list);
  const H = ['Matrícula', 'Nome', 'Função', 'Revenda', 'Visão', 'Grupo (ponto / turno)', 'Setor', 'Lotação', 'Turno/Tipo', 'Teleatendimento', 'Vigência', ...DIAS_SEMANA, 'Total semanal', 'Status', 'Pendências'];
  const D0 = H.indexOf('Segunda');
  const R = list.map(c => {
    const e = c.escala, v = c.val;
    return [c.matricula, c.nome, c.funcao, c.revenda, c.vis.areaNome, c.vis.grupo, c.setor, c.lotacao, c.turno, c.tele ? 'Sim' : 'Não', e ? dataBr(e.vigencia) : '',
      ...DIAS_SEMANA.map((_, i) => { if (!e) return ''; const d = e.dias[i] || {}; return d.tipo === 'T' ? `${d.ent}–${d.sai} (${minParaHm(+d.int || 0)})` : 'FOLGA'; }),
      v ? minParaHm(v.total) : '', ROT[st(c)], v ? v.msgs.filter(x => x.nivel !== 'info').map(x => x.texto).join(' | ') : ''];
  });
  const ws1 = X.utils.aoa_to_sheet([H, ...R]);
  ws1['!cols'] = H.map((h, i) => ({ wch: i === 1 ? 32 : i >= D0 && i < D0 + 7 ? 19 : i === H.length - 1 ? 60 : 15 }));
  ws1['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: R.length, c: H.length - 1 } }) };
  const D = [['Matrícula', 'Nome', 'Revenda', 'Visão', 'Grupo', 'Função', 'Dia', 'Situação', 'Entrada', 'Saída', 'Intervalo (min)', 'Horas']];
  list.forEach(c => { if (c.escala) linhasDia(c.escala).forEach(l => D.push([c.matricula, c.nome, c.revenda, c.vis.areaNome, c.vis.grupo, c.funcao, ...l])); });
  const C = [['Pessoas trabalhando por dia (só quem tem escala)'], ['Revenda', 'Visão', 'Grupo (ponto / turno)', 'Função', 'Pessoas', 'Sem escala', ...DIAS_SEMANA]];
  const m = new Map();
  list.forEach(c => { const k = [c.revenda, c.vis.areaNome, c.vis.grupo, c.vis.funcao].join('|'); if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  m.forEach((arr, k) => C.push([...k.split('|'), arr.length, arr.filter(c => !c.escala).length, ...porDia(arr)]));
  const wb = X.utils.book_new();

  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(D), 'Detalhe por dia');
  X.writeFile(wb, `Escalas_5x2_${list.length}_colab_${hoje()}.xlsx`);
}

function achaColunas(H) {
  const c = {};
  Object.keys(MAPA).forEach(k => { for (const a of MAPA[k]) { const i = H.indexOf(a); if (i >= 0 && !Object.values(c).includes(i)) { c[k] = i; break; } } });
  return c;
}
function revDoArquivo(nome) {
  const up = String(nome).toUpperCase(), mm = up.match(/(?:^|[^A-Z])(AL|SE|PA|RP|JZ|BF|PE|PT|BR)(?:[^A-Z]|$)/);
  if (mm) return COD_REV[mm[1]];
  const f = nrm(nome), hit = Object.values(COD_REV).concat(S.allRevs).find(r => f.includes(nrm(r)));
  return hit || '';
}
async function lerArquivo(file) {
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const abas = wb.SheetNames.slice().sort((a, b) => (nrm(b) === 'empregados') - (nrm(a) === 'empregados'));
  for (const aba of abas) {
    const A = X.utils.sheet_to_json(wb.Sheets[aba], { header: 1, defval: '', raw: false });
    const hi = A.slice(0, 25).findIndex(r => { const c = achaColunas(r.map(nrm)); return c.nome !== undefined && (c.matricula !== undefined || c.funcao !== undefined); });
    if (hi < 0) continue;
    const c = achaColunas(A[hi].map(nrm));
    const g = (r, k) => c[k] === undefined ? '' : String(r[c[k]] == null ? '' : r[c[k]]).trim();
    const rows = A.slice(hi + 1).filter(r => g(r, 'nome')).map(r => {
      let sit = g(r, 'situacao'); if (sit === '8') sit = 'Demitido (8)';
      return { matricula: g(r, 'matricula'), nome: g(r, 'nome'), funcao: g(r, 'funcao'), revenda: g(r, 'revenda'), setor: g(r, 'setor'), lotacao: g(r, 'lotacao'), turno: g(r, 'turno'), situacao: sit };
    });
    return { nome: file.name, aba, cols: c, rows, revenda: c.revenda === undefined ? revDoArquivo(file.name) : '' };
  }
  return { nome: file.name, erro: 'Não achei o cabeçalho com Nome e Matrícula (ou Cargo) neste arquivo.' };
}
function vImportar(m) {
  const I = S.imp;
  const des = r => /demit|deslig|rescis/i.test(r.situacao);
  m.innerHTML = `<section class="hero"><h2>Importar a planilha do DP</h2>
      <p>Use a mesma planilha de empregados do QLP (aba <b>Empregados</b>). Pode enviar um arquivo por revenda ou vários de uma vez. Colaboradores que saírem da planilha de uma revenda ficam inativos; escalas e a marcação de teleatendimento de quem continua são mantidas.</p></section>
    <section class="card"><div class="card-b" style="display:grid;gap:12px">
      <label class="drop" for="imp-file"><b>Escolher arquivos (.xlsx, .xls ou .csv)</b><span class="hint">Colunas lidas: ${Object.values(ROTULO).join(' · ')}</span></label>
      <input type="file" id="imp-file" accept=".xlsx,.xls,.xlsb,.csv" multiple hidden>
      <div id="imp-res"></div></div></section>`;
  m.querySelector('#imp-file').onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    $('#imp-res').innerHTML = '<p class="hint"><span class="spin"></span> Lendo arquivos…</p>';
    try { S.imp = { arqs: await Promise.all(files.map(lerArquivo)) }; } catch (err) { toast(esc(err.message), true); S.imp = null; }
    vImportar(m);
  };
  if (!I) return;
  const ok = I.arqs.filter(a => !a.erro);
  $('#imp-res').innerHTML = I.arqs.map((a, ix) => a.erro ? `<div class="msgbox er"><b>${esc(a.nome)}</b>: ${esc(a.erro)}</div>` : `
    <div class="card"><div class="card-h"><h3>${esc(a.nome)}</h3><span class="hint">aba ${esc(a.aba)} · ${a.rows.length} linhas · ${a.rows.filter(des).length} desligados (não entram)</span></div>
    <div class="card-b" style="display:grid;gap:10px">
      <div class="ck">${Object.keys(ROTULO).map(k => `<label style="cursor:default;${a.cols[k] === undefined ? 'color:var(--al);background:var(--als)' : ''}">${a.cols[k] === undefined ? '✕' : '✓'} ${ROTULO[k]}</label>`).join('')}</div>
      ${a.cols.matricula === undefined ? '<div class="msgbox er">Sem coluna de matrícula: este arquivo não pode ser importado.</div>' : ''}
      ${a.cols.revenda === undefined ? `<label class="f">Revenda deste arquivo (a planilha não tem a coluna)<input data-rev="${ix}" value="${esc(a.revenda)}" list="dl-rev" placeholder="Ex.: Alagoinhas"></label>` : `<p class="hint">Revendas no arquivo: <b>${esc(uniq(a.rows.map(r => r.revenda)).join(', '))}</b></p>`}
      <div class="ovf"><table class="tb"><tr><th>Matrícula</th><th>Nome</th><th>Função</th><th>Setor</th><th>Lotação</th><th>Turno</th><th>Situação</th></tr>
        ${a.rows.slice(0, 6).map(r => `<tr><td>${esc(r.matricula)}</td><td>${esc(r.nome)}</td><td>${esc(r.funcao)}</td><td>${esc(r.setor)}</td><td>${esc(r.lotacao || 'Base')}</td><td>${esc(r.turno)}</td><td>${esc(r.situacao)}</td></tr>`).join('')}</table></div>
    </div></div>`).join('') +
    `<datalist id="dl-rev">${uniq(Object.values(COD_REV).concat(S.allRevs)).map(r => `<option value="${esc(r)}">`).join('')}</datalist>` +
    (ok.length ? `<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn" data-cancel>Cancelar</button><button type="button" class="btn pr" data-imp>${ic('up')}Importar ${ok.reduce((s, a) => s + a.rows.filter(r => !des(r)).length, 0)} colaboradores</button></div>` : '');
  m.querySelectorAll('[data-rev]').forEach(i => { i.oninput = () => { I.arqs[+i.dataset.rev].revenda = i.value.trim(); }; });
  const cx = m.querySelector('[data-cancel]'); if (cx) cx.onclick = () => { S.imp = null; vImportar(m); };
  const bt = m.querySelector('[data-imp]');
  if (bt) bt.onclick = () => ocupado(bt, async () => {
    const rows = [];
    for (const a of ok) {
      if (a.cols.matricula === undefined) throw new Error(`${a.nome}: falta a coluna de matrícula.`);
      if (a.cols.revenda === undefined && !a.revenda) throw new Error(`Informe a revenda do arquivo ${a.nome}.`);
      a.rows.forEach(r => { if (r.matricula) rows.push(Object.assign({}, r, { revenda: r.revenda || a.revenda })); });
    }
    if (rows.some(r => !r.revenda)) throw new Error('Há linhas sem revenda. Confira a coluna Revenda da planilha.');
    const r = await call('importar', { rows });
    S.imp = null;
    toast(`Importado (${esc(r.revendas.join(', '))}): <b>${r.novos}</b> novos, <b>${r.atualizados}</b> atualizados, <b>${r.inativados}</b> inativados, ${r.desligados} desligados.`);
    S.view = 'escalas'; await carregar();
  });
}

/* ================= usuários ================= */
async function vUsuarios(m) {
  m.innerHTML = '<section class="card"><p class="empty"><span class="spin"></span> Carregando usuários…</p></section>';
  try { S.users = await call('usuarios'); } catch (e) { m.innerHTML = `<div class="msgbox er">${esc(e.message)}</div>`; return; }
  S.pend = S.users.filter(u => u.status === 'PENDENTE').length;
  desenhaUsuarios(m);
}
function formAcesso(u) {
  const revs = S.allRevs, sets = S.allSets, adm = u.perfil === 'ADMIN';
  const ck = (nome, arr, sel, todos) => `<div class="ck"><label><input type="checkbox" data-${nome}="*" ${sel.includes('*') ? 'checked' : ''}> <b>${todos}</b></label>${arr.map(v => `<label><input type="checkbox" data-${nome}="${esc(v)}" ${sel.includes(v) ? 'checked' : ''}> ${esc(v)}</label>`).join('')}</div>`;
  return `<div class="ap" data-form="${esc(u.id)}">
    <label class="f">Perfil<select data-perfil><option value="SUPERVISOR" ${!adm ? 'selected' : ''}>Supervisor (vê só o que for liberado)</option><option value="ADMIN" ${adm ? 'selected' : ''}>Administrador (vê tudo)</option></select></label>
    ${revs.length ? '' : '<p class="hint">Importe a planilha do DP para listar as revendas e os setores. Por enquanto dá para liberar "Todas" e "Todos".</p>'}
    <div><b style="font-size:12px;color:var(--mut)">REVENDAS</b>${ck('rv', revs, u.revendas, 'Todas')}</div>
    <div><b style="font-size:12px;color:var(--mut)">SETORES</b>${ck('st', sets, u.setores, 'Todos')}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn sm" data-u="cancel">Cancelar</button><button type="button" class="btn sm ok" data-u="salvar" data-id="${esc(u.id)}">${u.status === 'PENDENTE' ? 'Aprovar acesso' : 'Salvar acesso'}</button></div></div>`;
}
function desenhaUsuarios(m) {
  const U = S.users, pend = U.filter(u => u.status === 'PENDENTE'), out = U.filter(u => u.status !== 'PENDENTE');
  const esc2 = a => a.includes('*') ? 'todas' : a.join(', ') || '—';
  const linha = u => `<div class="us"><div><b>${esc(u.nome)}</b> <span class="pill ${u.status === 'ATIVO' ? 'p-OK' : u.status === 'PENDENTE' ? 'p-ALERTA' : 'p-ERRO'}">${u.status === 'ATIVO' ? (u.perfil === 'ADMIN' ? 'Administrador' : 'Supervisor') : u.status === 'PENDENTE' ? 'Aguardando aprovação' : 'Bloqueado'}</span>
      <small>Login: ${esc(u.login)}${u.telefone ? ' · ' + esc(u.telefone) : ''} · cadastro ${esc(dh(u.criadoEm))}${u.ultimoAcesso ? ' · último acesso ' + esc(dh(u.ultimoAcesso)) : ''}</small>
      ${u.status !== 'PENDENTE' ? `<small>Revendas: ${esc(esc2(u.revendas))} · Setores: ${esc(esc2(u.setores))}</small>` : ''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      ${u.status === 'PENDENTE' ? `<button type="button" class="btn sm ok" data-u="abrir" data-id="${esc(u.id)}">Aprovar</button><button type="button" class="btn sm er" data-u="BLOQUEADO" data-id="${esc(u.id)}">Recusar</button>`
      : `<button type="button" class="btn sm" data-u="abrir" data-id="${esc(u.id)}">Acesso</button><button type="button" class="btn sm" data-u="reset" data-id="${esc(u.id)}">Nova senha</button>${u.id !== S.user.id ? `<button type="button" class="btn sm ${u.status === 'ATIVO' ? 'er' : ''}" data-u="${u.status === 'ATIVO' ? 'BLOQUEADO' : 'ATIVO'}" data-id="${esc(u.id)}">${u.status === 'ATIVO' ? 'Bloquear' : 'Reativar'}</button>` : ''}`}</div>
    ${S.editUser === u.id ? formAcesso(u) : ''}</div>`;
  m.innerHTML = `<section class="card"><div class="card-h"><h3>Aguardando aprovação (${pend.length})</h3><button type="button" class="btn sm" data-u="ref">${ic('ref')}Atualizar</button></div>
      ${pend.map(linha).join('') || '<p class="empty">Nenhum cadastro pendente.</p>'}</section>
    <section class="card"><div class="card-h"><h3>Usuários (${out.length})</h3><span class="hint">Supervisores só veem as revendas e os setores liberados</span></div>${out.map(linha).join('')}</section>`;
  m.onclick = e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    const a = b.dataset.u, id = b.dataset.id;
    if (a === 'ref') return vUsuarios(m);
    if (a === 'abrir') { S.editUser = S.editUser === id ? null : id; return desenhaUsuarios(m); }
    if (a === 'cancel') { S.editUser = null; return desenhaUsuarios(m); }
    if (a === 'salvar') {
      const f = b.closest('[data-form]');
      const pick = n => [...f.querySelectorAll(`[data-${n}]:checked`)].map(x => x.getAttribute('data-' + n));
      let rv = pick('rv'), sts = pick('st'); if (rv.includes('*')) rv = ['*']; if (sts.includes('*')) sts = ['*'];
      return ocupado(b, async () => { await call('aprovarUsuario', { id, perfil: f.querySelector('[data-perfil]').value, revendas: rv, setores: sts }); S.editUser = null; toast('Acesso salvo.'); vUsuarios(m); });
    }
    if (a === 'reset') {
      if (!confirm('Gerar uma senha temporária para este usuário?')) return;
      return ocupado(b, async () => {
        const r = await call('resetSenha', { id });
        abrirModal(`<div class="mdl-h"><div><h2>Senha temporária</h2><small>Envie ao usuário e peça para trocar no primeiro acesso</small></div><button type="button" class="x" data-x>×</button></div>
          <div class="mdl-b"><p>Login: <b>${esc(r.login)}</b></p><p style="font:900 34px var(--fd);letter-spacing:.1em;margin:0">${esc(r.senhaTemporaria)}</p></div>
          <div class="mdl-f"><button type="button" class="btn pr" data-x>Fechar</button></div>`, true);
      });
    }
    if (a === 'ATIVO' || a === 'BLOQUEADO') {
      if (a === 'BLOQUEADO' && !confirm('Bloquear o acesso deste usuário?')) return;
      return ocupado(b, async () => { await call('statusUsuario', { id, status: a }); vUsuarios(m); });
    }
  };
}

/* ================= regras ================= */
function vRegras(m) {
  const c = S.cfg, adm = S.user.perfil === 'ADMIN';
  const P = parametrosRegra(c, hoje() < c.DATA_INICIO_5X2 ? c.DATA_INICIO_5X2 : hoje());
  const cards = [
    ['5 dias + 2 folgas', '5x2', 'Toda semana: 5 dias de trabalho e 2 de folga.'],
    ['Domingo', SN(c.DOMINGO_FOLGA) ? 'Folga' : 'Livre', SN(c.DOMINGO_FOLGA) ? 'Domingo é sempre uma das folgas (regra da empresa).' : 'Domingo pode ser dia de trabalho.'],
    ['Limite semanal hoje', minParaHm(P.semanal), `De ${dataBr(c.DATA_INICIO_5X2)} até ${dataBr(c.DATA_40H)}: ${c.LIMITE_SEMANAL_TRANSICAO}h. Depois: ${c.LIMITE_SEMANAL_FINAL}h.`],
    ['Máximo por dia', minParaHm(P.diario), `Na transição, até ${c.DIARIO_MAX_TRANSICAO}h (8h + as horas distribuídas). Depois: ${c.DIARIO_MAX_FINAL}h.`],
    ['Intervalo', '1h a 2h', 'Acima de 6h de trabalho; 15 min entre 4h e 6h (CLT, art. 71).'],
    ['Entre jornadas', '11h', 'Descanso mínimo entre o fim de um dia e o início do outro (CLT, art. 66).'],
    ['Descanso semanal', '35h', '24h de folga + 11h, seguidas, ao menos uma vez na semana.'],
    ['Teleatendimento', `${c.TELE_DIARIO}h/dia`, `Até ${c.TELE_SEMANAL}h na semana, com as pausas da NR-17 (Anexo II).`]
  ];
  m.innerHTML = `<section class="hero"><h2>Regras que o sistema confere</h2>
      <p>Base: Emenda Constitucional nº 141/2026 (fim da 6x1), em vigor a partir de ${dataBr(c.DATA_INICIO_5X2)}, e a CLT. Escalas com erro ficam em vermelho${SN(c.BLOQUEAR_ERRO) ? ' e não podem ser salvas' : ''}. Regimes diferentes previstos em acordo ou convenção coletiva devem ser confirmados com o DP.</p></section>
    <div class="rg">${cards.map(([t, v, p]) => `<div class="rc"><b>${t}</b><span class="v">${esc(v)}</span><p>${esc(p)}</p></div>`).join('')}</div>
    ${adm ? `<section class="card"><div class="card-h"><h3>Parâmetros (administrador)</h3><button type="button" class="btn sm pr" data-cfg>Salvar parâmetros</button></div>
      <div class="card-b row2">${Object.keys(c).map(k => `<label class="f">${esc(k.replace(/_/g, ' '))}<input data-k="${esc(k)}" value="${esc(c[k])}"></label>`).join('')}</div>
      <p class="hint" style="padding:0 16px 14px">Datas no formato AAAA-MM-DD, horários em HH:MM, S/N para sim ou não.</p></section>` : ''}`;
  const b = m.querySelector('[data-cfg]');
  if (b) b.onclick = () => ocupado(b, async () => {
    const d = {}; m.querySelectorAll('input[data-k]').forEach(i => { d[i.dataset.k] = i.value; });
    S.cfg = await call('salvarConfig', d); revalida(); toast('Parâmetros salvos. As escalas foram reavaliadas com as novas regras.'); render();
  });
}

/* ================= trocar senha ================= */
function modalSenha() {
  abrirModal(`<div class="mdl-h"><div><h2>Trocar senha</h2></div><button type="button" class="x" data-x aria-label="Fechar">×</button></div>
    <form class="mdl-b" id="fs"><label class="f">Senha atual<input type="password" name="atual" autocomplete="current-password"></label>
      <label class="f">Nova senha<input type="password" name="nova" autocomplete="new-password"></label>
      <label class="f">Repita a nova senha<input type="password" name="nova2" autocomplete="new-password"></label>
      <button class="btn pr" type="submit">Salvar nova senha</button></form>`, true);
  $('#fs').onsubmit = e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    if (f.nova !== f.nova2) return toast('As senhas não conferem.', true);
    ocupado(e.target.querySelector('button'), async () => { await call('trocarSenha', f); fecharModal(true); toast('Senha alterada.'); });
  };
}

/* ================= início ================= */
(async function iniciar() {
  const t = ls.get('tk');
  if (t) { S.token = t; try { await carregar(); return; } catch (e) { S.token = null; ls.set('tk', null); } }
  telaLogin();
})();
})();
</script>
