document.getElementById('prox').onclick=prox;document.getElementById('ant').onclick=ant;document.getElementById('rev').onclick=rev;
document.addEventListener('keydown',e=>{if(e.target===pinEl)return;if(e.key==='ArrowRight'||e.key===' ')prox();else if(e.key==='ArrowLeft')ant();else if(e.key==='r'||e.key==='R')rev();});
const qs=+new URLSearchParams(location.search).get('q');if(qs>=1&&qs<=P.length)cur=qs-1;
desenha();at().then(()=>{if(!qs)cur=Math.min(aberta,P.length)-1;desenha();});setInterval(at,3000);
</script></body></html>
