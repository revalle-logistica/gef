<script>
(function () {
'use strict';
/* ================= estado e utilidades ================= */
const S = { token: null, user: null, cfg: {}, cols: [], view: 'escalas', pend: 0, allRevs: [], allSets: [],
  f: { rev: '', st: '', q: '', tele: '', vis: '' }, sel: new Set(), pnl: { rev: '', vis: '' },
  imp: null, users: null, ed: null, lote: null, editUser: null, sups: [], ferias: [], feriados: [], ajustes: [], semana: '', mes: '',
  cad: { aba: 'col', rev: '', area: 'arm', f: 'pend', q: '', sel: new Set() } };
const $ = s => document.querySelector(s);
const root = document.getElementById('root'), modal = document.getElementById('modal');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nrm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim().replace(/:$/, '');
const uniq = a => [...new Set(a.filter(Boolean))].sort((x, y) => x.localeCompare(y, 'pt'));
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
const dataBr = iso => iso ? String(iso).split('-').reverse().join('/') : '';
const dh = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/); return m ? `${m[3]}/${m[2]}/${m[1]}${m[4] ? ' ' + m[4] : ''}` : String(s || ''); };
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const SN = v => String(v || '').toUpperCase() === 'S';
const ROT = { OK: 'Dentro das regras', ALERTA: 'Com alerta', ERRO: 'Com erro', SEM: 'Sem escala' };
const st = c => c.val ? c.val.status : 'SEM';
const IC = {
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  up: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 17v4h16v-4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M17 11a3 3 0 1 0 0-6M21.5 20c-.6-2.2-1.8-3.8-3.5-4.7"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',
  xls: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 11l5 6M14 11l-5 6"/>',
  pdf: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 14h6M9 17h4"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
  wand: '<path d="M15 4V2M15 10V8M11 6h2M17 6h2M4 20L14 10"/>',
  ref: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const ls = {
  get(k) { try { return localStorage.getItem('esc5x2_' + k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('esc5x2_' + k) : localStorage.setItem('esc5x2_' + k, v); } catch (e) { /* sem armazenamento */ } }
};

function trataResposta(r, ok, ko) {
  if (r && r.ok) return ok(r.data);
  if (r && r.sessao) { S.token = null; ls.set('tk', null); fecharModal(true); telaLogin({ t: r.erro }); }
  ko(new Error((r && r.erro) || 'Falha na comunicação.'));
}
/* Dentro do Apps Script usa google.script.run; pela página do GitHub usa fetch no link /exec (window.API_URL). */
function call(acao, dados) {
  return new Promise((ok, ko) => {
    if (window.API_URL) {
      fetch(window.API_URL, { method: 'POST', body: JSON.stringify({ token: S.token, acao, dados: dados || {} }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit' })
        .then(r => r.json()).then(r => trataResposta(r, ok, ko))
        .catch(() => ko(new Error('Sem conexão com o servidor. Verifique a internet.')));
      return;
    }
    google.script.run
      .withSuccessHandler(r => trataResposta(r, ok, ko))
      .withFailureHandler(e => ko(new Error((e && e.message) || 'Falha na comunicação.')))
      .api(S.token, acao, dados || {});
  });
}
let tT;
function toast(m, er) { const t = $('#toast'); t.innerHTML = m; t.className = 'toast' + (er ? ' er' : ''); t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, er ? 9000 : 5000); }
async function ocupado(bt, fn) {
  const h = bt ? bt.innerHTML : '';
  if (bt) { bt.disabled = true; bt.innerHTML = '<span class="spin"></span> Aguarde…'; }
  try { return await fn(); } catch (e) { toast(esc(e.message), true); } finally { if (bt && bt.isConnected) { bt.disabled = false; bt.innerHTML = h; } }
}

/* ================= login ================= */
function telaLogin(msg, aba) {
  aba = aba || 'in';
  const up = aba === 'up';
  root.innerHTML = `<div class="lg"><div class="lg-c">
    <div class="lg-h"><span class="logo">R</span><div><b>Escala 5x2</b><small>Revalle · escalas dos colaboradores</small></div></div>
    <div class="lg-t"><button type="button" data-aba="in" aria-pressed="${!up}">Entrar</button><button type="button" data-aba="up" aria-pressed="${up}">Criar acesso</button></div>
    <form class="lg-f" id="lgf" novalidate>
      <div id="lgmsg">${msg ? `<div class="msgbox ${msg.ok ? 'ok' : 'er'}">${esc(msg.t)}</div>` : ''}</div>
      ${up ? '<label class="f">Nome completo<input name="nome" autocomplete="name"></label>' : ''}
      <label class="f">E-mail${up ? ' (será o seu login)' : ''}<input name="login" type="email" autocapitalize="none" autocomplete="username" inputmode="email" placeholder="seu@email.com"></label>
      ${up ? '<label class="f">Telefone (WhatsApp)<input name="telefone" inputmode="tel"></label>' : ''}
      <label class="f">Senha<input name="senha" type="password" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
      ${up ? '<label class="f">Repita a senha<input name="senha2" type="password" autocomplete="new-password"></label>' : ''}
      <button class="btn pr" type="submit">${up ? 'Enviar cadastro para aprovação' : 'Entrar'}</button>
      <p class="lg-n">${up ? 'Quando o administrador aprovar, você recebe um e-mail com o link de acesso.' : 'Ainda não tem acesso? Toque em <b>Criar acesso</b>.'}</p>
    </form></div></div>`;
  root.querySelectorAll('[data-aba]').forEach(b => { b.onclick = () => telaLogin(null, b.dataset.aba); });
  $('#lgf').onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const bt = e.target.querySelector('button[type=submit]'), box = $('#lgmsg');
    const erro = t => { box.innerHTML = `<div class="msgbox er">${esc(t)}</div>`; };
    if (!f.login || !f.senha) return erro('Preencha e-mail e senha.');
    if (up) f.email = f.login;
    if (up && f.senha !== f.senha2) return erro('As senhas não conferem.');
    if (up && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(f.email || '').trim())) return erro('Informe um e-mail válido: ele será o seu login.');
    bt.disabled = true; const h = bt.innerHTML; bt.innerHTML = '<span class="spin"></span> Aguarde…';
    (async () => {
      try {
        if (up) {
          const r = await call('registrar', f);
          if (r.primeiro) { entrar(await call('login', f)); toast('Você é o <b>administrador</b> do sistema.'); return; }
          telaLogin({ ok: true, t: 'Cadastro enviado. Quando o administrador aprovar, você recebe um e-mail e já consegue entrar.' }, 'in');
        } else entrar(await call('login', f));
      } catch (err) { erro(err.message); bt.disabled = false; bt.innerHTML = h; }
    })();
  };
}
async function entrar(l) { S.token = l.token; ls.set('tk', l.token); await carregar(); }
async function sair() { try { await call('logout'); } catch (e) { /* ok */ } S.token = null; ls.set('tk', null); S.sel.clear(); telaLogin(); }

async function carregar() {
  const r = await call('carregar');
  S.user = r.usuario; S.cfg = r.cfg; S.pend = r.pendentes || 0;
  S.allRevs = r.todasRevendas || []; S.allSets = r.todosSetores || []; S.sups = r.supervisores || [];
  S.ferias = r.ferias || []; S.feriados = r.feriados || []; S.ajustes = r.ajustes || [];
  if (!S.semana) { const h = hoje(), i = S.cfg.DATA_INICIO_5X2 || h; S.semana = segundaDaSemana(h > i ? h : i); }
  if (!S.mes) { const h = hoje(), i = S.cfg.DATA_INICIO_5X2 || h; S.mes = (h > i ? h : i).slice(0, 7); }
  S.cols = r.colaboradores.sort((a, b) => (a.revenda + a.nome).localeCompare(b.revenda + b.nome, 'pt'));
  revalida();
  const ok = new Set(S.cols.map(c => c.matricula));
  [...S.sel].forEach(m => { if (!ok.has(m)) S.sel.delete(m); });
  const prim = (VISOES.find(([k]) => S.cols.some(c => c.vis.area === k)) || ['todos'])[0];
  if (!S.f.vis) S.f.vis = prim;
  if (!S.pnl.vis) S.pnl.vis = prim;
  render();
}
const feriasDe = m => S.ferias.filter(f => f.matricula === m);
const feriadosDe = rev => S.feriados.filter(f => f.revenda === rev);
const ddmm = iso => String(iso).split('-').reverse().slice(0, 2).join('/');
function ajustesDe(m) { const o = {}; S.ajustes.forEach(a => { if (a.matricula === m) o[a.data] = a; }); return o; }
function revalida() { S.cols.forEach(c => { c.vis = visaoColaborador(c); c.aj = ajustesDe(c.matricula); c.sem = semanaEfetiva(c.escala, S.semana, feriasDe(c.matricula), feriadosDe(c.revenda), c.aj); c.avisos = avisosSemana(c.sem); c.semVal = validarSemanaReal(c.sem, { tele: c.tele, cfg: S.cfg }); c.val = c.escala ? validarEscala(c.escala, { tele: c.tele, cfg: S.cfg }) : null; }); }

/* ================= casca ================= */
function render() {
  const adm = S.user.perfil === 'ADMIN';
  const tabs = [['escalas', 'cal', 'Escalas'], ['mes', 'cal', 'Mês'], ['painel', 'chart', 'Painel']]
    .concat(adm ? [['cadastro', 'users', 'Cadastro'], ['importar', 'up', 'Importar DP'], ['usuarios', 'key', 'Usuários']] : [])
    .concat([['regras', 'shield', 'Regras']]);
  if (!tabs.some(t => t[0] === S.view)) S.view = 'escalas';
  root.innerHTML = `<header class="top"><div class="top-in"><span class="logo">R</span>
    <div class="br"><b>Escala 5x2</b><small>${esc(S.cfg.EMPRESA || 'Revalle')}</small></div>
    <nav class="nav">${tabs.map(([k, i, t]) => `<button type="button" data-v="${k}" aria-current="${S.view === k}">${ic(i)}${t}${k === 'usuarios' && S.pend ? `<em>${S.pend}</em>` : ''}${k === 'cadastro' && nPendCad() ? `<em>${nPendCad()}</em>` : ''}</button>`).join('')}</nav>
    <div class="usr"><span>${esc(S.user.nome.split(' ')[0])}${adm ? ' · admin' : ''}</span>
      <button class="btn sm" type="button" data-a="senha" title="Trocar senha" aria-label="Trocar senha">${ic('key')}</button>
      <button class="btn sm" type="button" data-a="sair">Sair</button></div></div></header><main id="main"></main>`;
  root.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => { S.view = b.dataset.v; render(); }; });
  root.querySelector('[data-a=sair]').onclick = sair;
  root.querySelector('[data-a=senha]').onclick = modalSenha;
  ({ escalas: vEscalas, mes: vMes, painel: vPainel, cadastro: vCadastro, importar: vImportar, usuarios: vUsuarios, regras: vRegras })[S.view]($('#main'));
}
function abrirModal(html, sm) {
  modal.innerHTML = `<div class="mdl${sm ? ' sm' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  modal.hidden = false;
}
function fecharModal(forcar) {
  if (!forcar && S.ed && S.ed.sujo && !confirm('Sair sem salvar as alterações desta escala?')) return;
  const eraEd = !!S.ed;
  modal.hidden = true; modal.innerHTML = ''; S.ed = null; S.lote = null;
  if (eraEd && !forcar && (S.view === 'escalas' || S.view === 'painel')) render();
}
modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x]')) fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) fecharModal(); });

/* ================= semana ================= */
function barraSemana() {
  const fim = isoMaisDias(S.semana, 6), fs = S.feriados.filter(f => f.data >= S.semana && f.data <= fim);
  return `<div class="sw2"><button type="button" class="btn sm" data-sem="-7" aria-label="Semana anterior">‹</button>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px">Semana de<input type="date" data-semdt value="${esc(S.semana)}" style="width:auto"></label>
    <span class="hint">a ${dataBr(fim)}</span><button type="button" class="btn sm" data-sem="7" aria-label="Próxima semana">›</button>
    ${fs.length ? `<span class="pill p-ERRO">Feriado: ${fs.map(f => esc(ddmm(f.data) + ' ' + f.descricao + ' (' + f.revenda + ')')).join(' · ')}</span>` : ''}</div>`;
}
function ligaSemana(m, redesenha) {
  m.querySelectorAll('[data-sem]').forEach(b => { b.onclick = () => { S.semana = isoMaisDias(S.semana, +b.dataset.sem); revalida(); redesenha(); }; });
  const i = m.querySelector('[data-semdt]'); if (i) i.onchange = () => { if (i.value) { S.semana = segundaDaSemana(i.value); revalida(); redesenha(); } };
}

/* ================= escalas ================= */
function opts(arr, sel, todos) { return `<option value="">${todos}</option>` + arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
const VIS_TXT = { entrega: 'Entrega · ponto de apoio e função', pux: 'Puxadores', arm: 'Armazém · turno e função', adm: 'Administrativo', todos: 'Todos' };
function filtrados(ignSt, ignVis) {
  const f = S.f, q = nrm(f.q);
  return S.cols.filter(c => (!f.rev || c.revenda === f.rev) && (ignVis || f.vis === 'todos' || c.vis.area === f.vis) &&
    (!f.tele || c.tele) && (!f.ext || (f.ext === 'ferias' ? c.sem.some(d => d.tipo === 'FER') : c.avisos.length > 0)) && (ignSt || !f.st || st(c) === f.st) && (!q || nrm(c.nome + ' ' + c.matricula + ' ' + c.funcao + ' ' + c.lotacao).includes(q)));
}
function alvo() { const sel = S.cols.filter(c => S.sel.has(c.matricula)); return sel.length ? { lista: sel, tipo: 'selecionados' } : { lista: ordenar(filtrados()), tipo: 'da lista' }; }
function ordenar(L) { return L.slice().sort((a, b) => (S.f.rev ? 0 : a.revenda.localeCompare(b.revenda, 'pt')) || a.vis.ordem.localeCompare(b.vis.ordem) || a.vis.fordem.localeCompare(b.vis.fordem) || a.nome.localeCompare(b.nome, 'pt')); }
/** Agrupa por grupo da visão (ponto, turno…) e, dentro, por função. */
function agrupar(L, comArea) {
  const G = new Map();
  ordenar(L).forEach(c => {
    const gk = (S.f.rev ? '' : c.revenda + ' · ') + (comArea || c.vis.area === 'adm' ? c.vis.areaNome + (c.vis.area === 'adm' ? '' : ' · ') : '') + (c.vis.area === 'adm' ? '' : c.vis.grupo);
    if (!G.has(gk)) G.set(gk, new Map());
    const F = G.get(gk);
    if (!F.has(c.vis.funcao)) F.set(c.vis.funcao, []);
    F.get(c.vis.funcao).push(c);
  });
  return G;
}
function porDia(arr) { const d = [0, 0, 0, 0, 0, 0, 0]; arr.forEach(c => { (c.sem || []).forEach((x, i) => { if (x.tipo === 'T') d[i]++; }); }); return d; }
function faixaDias(arr) {
  const d = porDia(arr), sem = arr.filter(c => !c.escala).length;
  const fe = arr.filter(c => c.sem && c.sem.some(x => x.tipo === 'FER')).length;
  return `<div class="cd">${d.map((v, i) => `<span title="${DIAS_SEMANA[i]}: ${v} trabalhando"><small>${DIAS_CURTO[i]}</small>${v}</span>`).join('')}</div>${sem ? `<em class="se">${sem} sem escala</em>` : ''}${fe ? `<em class="se" style="color:var(--excess,#6d3fd8)">${fe} de férias</em>` : ''}`;
}
function vEscalas(m) {
  const f = S.f;
  const revs = uniq(S.cols.map(c => c.revenda));
  if (f.rev && !revs.includes(f.rev)) f.rev = '';
  if (!S.cols.length) {
    m.innerHTML = `<div class="card empty"><h3>Nenhum colaborador por aqui ainda</h3><p>${S.user.perfil === 'ADMIN' ? 'Comece importando a planilha do DP na aba <b>Importar DP</b>.' : 'Ainda não há colaboradores vinculados a você. O administrador faz o vínculo na tela Cadastro.'}</p></div>`;
    return;
  }
  m.innerHTML = `<section class="card">
    ${barraSemana()}
    <div class="vt" id="vt"></div>
    <div class="filt">
      <label class="f">Revenda<select data-f="rev">${opts(revs, f.rev, 'Todas')}</select></label>
      <label class="f">Buscar<input data-f="q" value="${esc(f.q)}" placeholder="Nome, matrícula, função ou ponto"></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="acts" id="acts"></div>
    <div class="ls" id="ls"></div></section>`;
  m.querySelector('select[data-f=rev]').onchange = e => { f.rev = e.target.value; vEscalas(m); };
  ligaSemana(m, () => vEscalas(m));
  m.querySelector('input[data-f=q]').oninput = e => { f.q = e.target.value; lista(); };
  m.onclick = e => {
    const t = e.target.closest('button, [data-chip]');
    if (!t) return;
    if (t.dataset.vis) { f.vis = t.dataset.vis; lista(); }
    else if (t.dataset.chip !== undefined) { const k = t.dataset.chip; if (k === 'tele') f.tele = f.tele ? '' : 'S'; else if (k === 'ferias' || k === 'feriado') f.ext = f.ext === k ? '' : k; else f.st = k; lista(); }
    else if (t.dataset.ed) abrirEditor(t.dataset.ed);
    else if (t.dataset.gsel) { const L = grupoSel[t.dataset.gsel] || []; const all = L.every(c => S.sel.has(c.matricula)); L.forEach(c => all ? S.sel.delete(c.matricula) : S.sel.add(c.matricula)); lista(); }
    else if (t.dataset.ac === 'todos') { const L = filtrados(); const all = L.every(c => S.sel.has(c.matricula)); L.forEach(c => all ? S.sel.delete(c.matricula) : S.sel.add(c.matricula)); lista(); }
    else if (t.dataset.ac === 'limpar') { S.sel.clear(); lista(); }
    else if (t.dataset.ac === 'lote') modalLote();
    else if (t.dataset.ac === 'xls') ocupado(t, () => excelLote(alvo().lista));
    else if (t.dataset.ac === 'pdf') ocupado(t, () => pdfServidor(alvo().lista.map(c => c.matricula), 'fichas', S.semana));
    else if (t.dataset.ac === 'quadro') ocupado(t, () => pdfServidor(alvo().lista.map(c => c.matricula), 'quadro', S.semana));
  };
  m.onchange = e => { const c = e.target.closest('[data-sel]'); if (c) { c.checked ? S.sel.add(c.dataset.sel) : S.sel.delete(c.dataset.sel); acoes(); } };
  lista();
}
let grupoSel = {};
function lista() {
  const f = S.f, tudo = filtrados(true, true), base = filtrados(true), L = filtrados();
  $('#vt').innerHTML = VISOES.concat([['todos', 'Todos']]).map(([k]) => {
    const n = k === 'todos' ? tudo.length : tudo.filter(c => c.vis.area === k).length;
    return `<button type="button" data-vis="${k}" aria-pressed="${f.vis === k}" ${n || k === 'todos' ? '' : 'class="vz"'}>${VIS_TXT[k]}<i>${n}</i></button>`;
  }).join('');
  const n = k => base.filter(c => st(c) === k).length;
  $('#chips').innerHTML = [['', 'Todos', base.length], ['SEM', 'Sem escala', n('SEM')], ['ERRO', 'Com erro', n('ERRO')], ['ALERTA', 'Com alerta', n('ALERTA')], ['OK', 'Dentro das regras', n('OK')]]
    .map(([k, t, q]) => `<button type="button" class="chip" data-chip="${k}" aria-pressed="${f.st === k}">${k ? `<span class="dot d-${k}"></span>` : ''}${t} <i>${q}</i></button>`).join('') +
    `<button type="button" class="chip" data-chip="tele" aria-pressed="${!!f.tele}">Teleatendimento <i>${base.filter(c => c.tele).length}</i></button>` +
    `<button type="button" class="chip" data-chip="ferias" aria-pressed="${f.ext === 'ferias'}">Férias na semana <i>${base.filter(c => c.sem.some(d => d.tipo === 'FER')).length}</i></button>` +
    `<button type="button" class="chip" data-chip="feriado" aria-pressed="${f.ext === 'feriado'}"><span class="dot d-ERRO"></span>Trabalha em feriado <i>${base.filter(c => c.avisos.length).length}</i></button>`;
  grupoSel = {};
  let h = '', gi = 0;
  agrupar(L, f.vis === 'todos').forEach((F, gk) => {
    const todosG = [...F.values()].flat(); grupoSel[gi] = todosG;

/* ================= visão do mês ================= */
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nomeMes = ym => { const p = ym.split('-'); return MESES[+p[1] - 1] + ' de ' + p[0]; };
function mesColab(c) {
  const fer = feriasDe(c.matricula), fds = feriadosDe(c.revenda), aj = c.aj || ajustesDe(c.matricula);
  const dias = diasDoMes(S.mes).map(dt => diaEfetivo(c.escala, dt, fer, fds, aj));
  const semanas = [];
  for (let s = segundaDaSemana(dias[0].data); s <= dias[dias.length - 1].data; s = isoMaisDias(s, 7)) {
    const sem = semanaEfetiva(c.escala, s, fer, fds, aj);
    semanas.push({ ini: s, sem, val: validarSemanaReal(sem, { tele: c.tele, cfg: S.cfg }) });
  }
  const horas = dias.reduce((t, d) => { const x = d.tipo === 'T' ? calcDia(d) : null; return t + (x ? x.liquido : 0); }, 0);
  return { dias, semanas, horas };
}
function vMes(m) {
  const f = S.f, revs = uniq(S.cols.map(c => c.revenda));
  if (f.rev && !revs.includes(f.rev)) f.rev = '';
  if (!S.cols.length) { m.innerHTML = `<div class="card empty"><h3>Nenhum colaborador por aqui ainda</h3><p>${S.user.perfil === 'ADMIN' ? 'Importe o relatório do DP na aba <b>Importar DP</b>.' : 'Ainda não há colaboradores vinculados a você.'}</p></div>`; return; }
  const datas = diasDoMes(S.mes), L = ordenar(filtrados(true));
  const ferAll = d => S.feriados.filter(x => x.data === d && (!f.rev || x.revenda === f.rev));
  const tudo = filtrados(true, true);
  let corpo = '', gi = 0, nErro = 0;
  const G = agrupar(L, f.vis === 'todos');
  G.forEach((F, gk) => {
    const arr = [...F.values()].flat();
    corpo += `<tr class="mg"><td colspan="${datas.length + 3}"><b>${esc(gk)}</b> <span>${arr.length} ${arr.length === 1 ? 'pessoa' : 'pessoas'}</span></td></tr>`;
    arr.forEach(c => {
      const M = mesColab(c), err = M.semanas.filter(s => s.val && s.val.status === 'ERRO').length;
      if (err) nErro++;
      corpo += `<tr><td class="mn"><button type="button" class="lk" data-ed="${esc(c.matricula)}" title="Abrir o padrão semanal">${esc(c.nome)}</button><small>${esc(codigoMatricula(c.matricula))} · ${esc(c.funcao)}</small></td>` +
        M.dias.map(d => {

let XP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (XP) return XP;
  XP = new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; // barras escapadas: o Apps Script corta '//' ao servir
    s.onload = () => ok(window.XLSX);
    s.onerror = () => { XP = null; ko(new Error('Não consegui carregar o leitor de Excel. Verifique a internet e tente de novo.')); };
    document.head.appendChild(s);
  });
  return XP;
}
function baixar(b64, nome, mime) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}

 * Aqui os registros são percorridos em sequência, o índice é corrigido e o arquivo é lido de novo.

function repararXls(X, bytes) {
  try {
    const cfb = X.CFB.read(bytes, { type: 'array' });

}

/** Lê a planilha de feriados: cabeçalho Data | Dia da semana | Feriado | Tipo | Validação | Conta no alerta | Observação. */
async function lerFeriados(file) {
  const X = await loadXLSX(), wb = X.read(await file.arrayBuffer(), { type: 'array' });
  for (const n of wb.SheetNames) {
    const A = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true });
    const hi = A.slice(0, 30).findIndex(r => { const H = r.map(nrm); return H.includes('data') && H.includes('feriado'); });
    if (hi < 0) continue;
    const H = A[hi].map(nrm), col = k => H.indexOf(k);
    const titulo = A.slice(0, hi).flat().map(String).find(x => /feriados/i.test(x)) || '';
    const mt = titulo.match(/feriados\s*[-–—]\s*(.+?)\s*(\(|$)/i), cod = (titulo.match(/\(([A-Z]{2})\)/) || [])[1];
    const paraIso = v => {
      if (typeof v === 'number') { const d = X.SSF.parse_date_code(v); return d ? d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0') : ''; }
      const s = String(v).trim(); let k = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (k) return k[0];
      k = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (k) { const y = k[3].length === 2 ? '20' + k[3] : k[3]; return y + '-' + k[2].padStart(2, '0') + '-' + k[1].padStart(2, '0'); }
      return '';
    };
    const itens = A.slice(hi + 1).map(r => ({ data: paraIso(r[col('data')]), descricao: String(r[col('feriado')] || '').trim(), tipo: col('tipo') >= 0 ? String(r[col('tipo')]).trim() : '',
      validacao: col('validacao') >= 0 ? String(r[col('validacao')]).trim() : '', contaAlerta: col('conta no alerta') >= 0 ? String(r[col('conta no alerta')]).trim() : 'Sim', obs: col('observacao') >= 0 ? String(r[col('observacao')]).trim() : '' }))
      .filter(x => x.data && x.descricao);
    return { itens, revenda: (cod && COD_REV[cod]) || (mt ? mt[1].trim() : ''), arquivo: file.name };
  }
  throw new Error('Não achei as colunas Data e Feriado na planilha.');
}

  m.innerHTML = `<section class="hero"><h2>Regras que o sistema confere</h2>
      <p>Base: Emenda Constitucional nº 141/2026 (fim da 6x1), em vigor a partir de ${dataBr(c.DATA_INICIO_5X2)}, e a CLT. Escalas com erro ficam em vermelho${SN(c.BLOQUEAR_ERRO) ? ' e não podem ser salvas' : ''}. Regimes diferentes previstos em acordo ou convenção coletiva devem ser confirmados com o DP.</p></section>
    <div class="rg">${cards.map(([t, v, p]) => `<div class="rc"><b>${t}</b><span class="v">${esc(v)}</span><p>${esc(p)}</p></div>`).join('')}</div>
    ${adm ? `<section class="card"><div class="card-h"><h3>Parâmetros (administrador)</h3><button type="button" class="btn sm pr" data-cfg>Salvar parâmetros</button></div>
      <div class="card-b row2">${Object.keys(c).filter(k => k !== 'PONTOS_APOIO').map(k => `<label class="f">${esc(k.replace(/_/g, ' '))}<input data-k="${esc(k)}" value="${esc(c[k])}"></label>`).join('')}</div>
      <p class="hint" style="padding:0 16px 14px">Datas no formato AAAA-MM-DD, horários em HH:MM, S/N para sim ou não.</p></section>` : ''}`;
  const b = m.querySelector('[data-cfg]');
  if (b) b.onclick = () => ocupado(b, async () => {
    const d = {}; m.querySelectorAll('input[data-k]').forEach(i => { d[i.dataset.k] = i.value; });
    S.cfg = await call('salvarConfig', d); revalida(); toast('Parâmetros salvos. As escalas foram reavaliadas com as novas regras.'); render();
  });
}

/* ================= trocar senha ================= */
function modalSenha() {
  abrirModal(`<div class="mdl-h"><div><h2>Trocar senha</h2></div><button type="button" class="x" data-x aria-label="Fechar">×</button></div>
    <form class="mdl-b" id="fs"><label class="f">Senha atual<input type="password" name="atual" autocomplete="current-password"></label>
      <label class="f">Nova senha<input type="password" name="nova" autocomplete="new-password"></label>
      <label class="f">Repita a nova senha<input type="password" name="nova2" autocomplete="new-password"></label>
      <button class="btn pr" type="submit">Salvar nova senha</button></form>`, true);
  $('#fs').onsubmit = e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    if (f.nova !== f.nova2) return toast('As senhas não conferem.', true);
    ocupado(e.target.querySelector('button'), async () => { await call('trocarSenha', f); fecharModal(true); toast('Senha alterada.'); });
  };
}

/* ================= início ================= */
(async function iniciar() {
  const t = ls.get('tk');
  if (t) { S.token = t; try { await carregar(); return; } catch (e) { S.token = null; ls.set('tk', null); } }
  telaLogin();
})();
})();
</script>
